<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CMZ · No internet</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#102447;color:#fff;font:16px/1.55 'Segoe UI',Arial,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
    .box{max-width:420px}.icon{font-size:3rem}h1{font-size:1.5rem;margin:.4rem 0}p{color:#d5e0f1}
    button{margin-top:1rem;min-height:48px;padding:.7rem 1.6rem;border:0;border-radius:12px;background:#ffc629;color:#142746;font:inherit;font-weight:800}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📴</div>
    <h1>No internet connection</h1>
    <p>CMZ needs the internet the first time you open it. After that, pages you have opened are saved on this phone and work offline.</p>
    <p>Turn on mobile data or Wi-Fi, then tap Try again.</p>
    <button type="button" onclick="location.href='https://creativemathzone.in/web/student.html'">Try again</button>
  </div>
  <script>window.addEventListener('online', function () { location.href = 'https://creativemathzone.in/web/student.html'; });</script>
</body>
</html>
