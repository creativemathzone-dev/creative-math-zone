<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#223f7c">
  <meta http-equiv="refresh" content="0; url=web/">
  <title>Creative Math Zone</title>
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:linear-gradient(135deg,#24457f,#223f7c 62%,#1b315d);color:#fff;font:500 1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:min(100%,28rem);padding:2.5rem 1.5rem;border:1px solid #ffffff35;border-radius:1.5rem;background:#ffffff12;box-shadow:0 18px 55px #07162c40}
    img{width:5rem;height:5rem;margin:0 auto 1rem;border:3px solid #f5d327;border-radius:50%;background:#fff;object-fit:contain}
    h1{margin:0;font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.15}
    p{margin:.65rem 0 1.25rem;color:#e7efff}
    a{display:inline-flex;min-height:2.75rem;align-items:center;justify-content:center;padding:.65rem 1.15rem;border-radius:999px;background:#f5d327;color:#1c2340;font-weight:800;text-decoration:none}
    a:focus-visible{outline:3px solid white;outline-offset:3px}
  </style>
  <script>window.location.replace(new URL('web/', window.location.href).href);</script>
</head>
<body>
  <main>
    <img src="web/icons/creative-math-zone-logo.png" alt="">
    <h1>Creative Math Zone</h1>
    <p>Opening your learning and class portals…</p>
    <a href="web/">Continue to Creative Math Zone</a>
  </main>
</body>
</html>
