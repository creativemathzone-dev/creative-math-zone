<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Math Zone · Animated logo</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1b30; --navy-2:#16243b; --gold:#f3b11c; --paper:#fbfaf6; --ink-3:#9fb2d0;
  --size:min(78vmin,560px);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--navy);color:#fff;font-family:var(--body);display:grid;place-items:center;overflow:hidden;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:34px 34px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 46%,rgba(243,177,28,.22),transparent 52%);pointer-events:none}

.stage{position:relative;width:var(--size);height:var(--size)}

/* the logo itself */
.logo{position:absolute;inset:19%;border-radius:50%;overflow:hidden;z-index:3;
  box-shadow:0 0 0 4px rgba(243,177,28,.9),0 0 60px 6px rgba(243,177,28,.45),0 24px 60px rgba(0,0,0,.45);
  animation:enter 1.3s cubic-bezier(.2,.9,.25,1.15) both, float 7s ease-in-out 1.3s infinite, glow 3.6s ease-in-out 1.3s infinite}
.logo img{width:100%;height:100%;display:block;transform:scale(1.07)}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
  transform:translateX(-120%);animation:shine 6s ease-in-out 2.2s infinite}

/* spinning halo behind the logo */
.halo{position:absolute;inset:16%;border-radius:50%;z-index:2;
  background:conic-gradient(from 0deg,transparent 0 55%,var(--gold) 80%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  animation:spin 5s linear infinite, fade 1s .8s both}

/* orbiting symbols */
.orbit{position:absolute;inset:0;z-index:4;animation:spin var(--t) linear infinite, fade 1s .9s both}
.orbit.rev{animation-direction:reverse,normal}
.orbit .ring{position:absolute;inset:var(--in);border-radius:50%;border:1px dashed rgba(159,178,208,.28)}
.sym{position:absolute;top:50%;left:50%;width:0;height:0;
  transform:rotate(var(--a)) translateX(calc(var(--size) * var(--r))) rotate(calc(var(--a) * -1))}
.sym i{position:absolute;left:0;top:0;display:grid;place-items:center;width:calc(var(--size)*.105);height:calc(var(--size)*.105);
  margin:calc(var(--size)*-.0525) 0 0 calc(var(--size)*-.0525);
  font:700 calc(var(--size)*.075)/1 var(--display);font-style:normal;color:var(--c);
  text-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent);
  animation:spin var(--t) linear infinite reverse}
.orbit.rev .sym i{animation-direction:normal}

/* twinkles */
.tw{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);z-index:1;opacity:0;animation:tw 3.2s ease-in-out infinite}

/* caption */
.cap{position:absolute;left:0;right:0;bottom:-4.5%;text-align:center;z-index:5;animation:fade 1s 1.6s both}
.cap b{display:block;font:800 clamp(1.3rem,3.6vmin,2rem)/1 var(--display);letter-spacing:-.02em}
.cap span{display:block;margin-top:.4rem;color:var(--ink-3);font-style:italic;font-size:clamp(.85rem,2vmin,1.05rem)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes enter{from{opacity:0;transform:scale(.2) rotate(-200deg)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2%)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 4px rgba(243,177,28,.9),0 0 50px 4px rgba(243,177,28,.35),0 24px 60px rgba(0,0,0,.45)}
  50%{box-shadow:0 0 0 4px #ffd25a,0 0 90px 14px rgba(243,177,28,.6),0 24px 60px rgba(0,0,0,.45)}}
@keyframes shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1.3)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .orbit,.sym i,.halo{animation:none!important}
}
</style>
</head>
