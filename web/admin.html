  const canFix = can('ATTENDANCE_CORRECT');

  main.innerHTML =
    '<div class="head"><div><h1>Attendance</h1><p>Class sessions and who attended. ' + (canFix ? 'Click a session to correct marks.' : 'Click a session to see details.') + '</p></div></div>' +
    '<div class="toolbar">' +
      '<input id="at-from" type="date" value="' + esc(st.from) + '" title="From">' +
      '<input id="at-to" type="date" value="' + esc(st.to) + '" title="To">' +
      '<select id="at-batch"><option value="">All batches</option>' +
        L('batches').map(b => '<option value="' + esc(b.BatchID) + '"' + (st.batchId === b.BatchID ? ' selected' : '') + '>' + esc(b.BatchName) + '</option>').join('') + '</select>' +
      '<select id="at-teacher"><option value="">All teachers</option>' +
        L('teachers').map(t => '<option value="' + esc(t.TeacherID) + '"' + (st.teacherId === t.TeacherID ? ' selected' : '') + '>' + esc(t.Name) + '</option>').join('') + '</select>' +
    '</div><div id="at-list"></div>';

  const load = async () => {
    const rows = await api('attendance.sessions', { from: st.from, to: st.to, batchId: st.batchId, teacherId: st.teacherId });
    $('#at-list').innerHTML = rows.length
      ? '<div class="tablewrap"><table class="stack"><thead><tr><th>Date</th><th>Time</th><th>Subject</th><th>Batch</th><th>Teacher</th><th>P</th><th>L</th><th>A</th><th>Status</th></tr></thead><tbody>' +
        rows.map(r =>
          '<tr class="click" data-s="' + esc(r.SessionID) + '">' +
          '<td data-l="Date"><b>' + esc(fmtDate(r.Date)) + '</b></td>' +
          '<td data-l="Time">' + esc(fmtHM(r.StartTime)) + ' – ' + esc(fmtHM(r.EndTime)) + '</td>' +
          '<td data-l="Subject">' + esc(r.SubjectName) + '</td><td data-l="Batch">' + esc(r.BatchName) + '</td>' +
          '<td data-l="Teacher">' + esc(r.TeacherName) + '</td>' +
          '<td data-l="Present"><b>' + r.Present + '</b></td><td data-l="Late">' + r.Late + '</td><td data-l="Absent">' + r.Absent + '</td>' +
          '<td>' + (r.Status === 'OPEN' ? '<span class="pill warn">Open</span>' : '<span class="pill">Closed</span>') + '</td></tr>').join('') +
        '</tbody></table></div>'
      : '<div class="card empty"><b>No sessions found</b>Try a wider date range.</div>';
    $$('[data-s]', main).forEach(tr => tr.addEventListener('click', () => detail(tr.dataset.s).catch(fail)));
  };

  const detail = async sid => {
    const d = await api('attendance.detail', { sessionId: sid });
    const s = d.session;
    const mark = (studentId, name, status) => busy(null, async () => {
      const reason = prompt('Reason for marking ' + name + ' ' + status + '?');
      if (!reason || !reason.trim()) return;
      await api('attendance.correct', { sessionId: sid, studentId: studentId, status: status, reason: reason.trim() });
      toast('Attendance updated.');
      await detail(sid); await load();
    });
    openDlg(s.SubjectName + ' · ' + s.BatchName,
      '<p class="muted" style="margin:0 0 .75rem">' + esc(fmtDate(s.Date)) + ' · ' + esc(fmtHM(s.StartTime)) + '–' + esc(fmtHM(s.EndTime)) + ' · ' + esc(s.TeacherName) + (s.RoomName ? ' · ' + esc(s.RoomName) : '') + '</p>' +
      (d.students.length
        ? '<div class="tablewrap"><table><thead><tr><th>Student</th><th>Status</th>' + (canFix ? '<th>Correct</th>' : '') + '</tr></thead><tbody>' +
          d.students.map(x =>
            '<tr data-sid="' + esc(x.StudentID) + '"><td><b>' + esc(x.Name) + '</b><div class="muted" style="font-size:.82rem">' + esc(x.RollNo || x.StudentID) + '</div></td>' +
            '<td>' + (x.Status ? pill(x.Status) : '<span class="pill">Not marked</span>') +
              (x.Method ? '<div class="muted" style="font-size:.78rem">' + esc(String(x.Method).replace(/_/g, ' ').toLowerCase()) + '</div>' : '') + '</td>' +
            (canFix ? '<td><button class="btn small" data-m="PRESENT">P</button> <button class="btn small" data-m="LATE">L</button> <button class="btn small" data-m="ABSENT">A</button></td>' : '') +
            '</tr>').join('') + '</tbody></table></div>'
        : '<div class="card empty"><b>No students on this class</b></div>'),
      '<button class="btn primary" type="button" data-close>Done</button>',
      dlg => {
        if (!canFix) return;
        $$('[data-sid]', dlg).forEach(row => {
          const x = d.students.find(z => z.StudentID === row.dataset.sid);
          $$('[data-m]', row).forEach(b => b.addEventListener('click', () => mark(x.StudentID, x.Name, b.dataset.m)));
        });
      });
  };

  $('#at-from').addEventListener('change', e => { st.from = e.target.value; load().catch(fail); });
  $('#at-to').addEventListener('change', e => { st.to = e.target.value; load().catch(fail); });
  $('#at-batch').addEventListener('change', e => { st.batchId = e.target.value; load().catch(fail); });
  $('#at-teacher').addEventListener('change', e => { st.teacherId = e.target.value; load().catch(fail); });
  await load();
};

/* ---------- reports ---------- */
VIEWS.reports = async (main, tab) => {
  const localDay = off => new Date(Date.now() - new Date().getTimezoneOffset() * 60000 + off * 86400000).toISOString().slice(0, 10);
  const st = VIEWS.reports.state = VIEWS.reports.state || { tab: '', from: localDay(-30), to: localDay(0), month: localDay(0).slice(0, 7), threshold: 75 };
  const fmt = n => '₹' + (Number(n) || 0).toLocaleString('en-IN');
  const tabs = [];
  if (can('FINANCE_VIEW')) tabs.push(['collection', 'Fee collection'], ['dues', 'Outstanding dues']);
  if (can('STUDENT_VIEW')) tabs.push(['attendance', 'Attendance']);
  if (can('TEACHER_INCOME_MANAGE')) tabs.push(['teacherpay', 'Teacher pay']);
  if (!tabs.length) { main.innerHTML = '<div class="card empty"><b>No reports available</b>Ask the Super Admin for access.</div>'; return; }
  st.tab = tab || (tabs.some(t => t[0] === st.tab) ? st.tab : tabs[0][0]);

  const dateBar = '<input id="rp-from" type="date" value="' + esc(st.from) + '" title="From"><input id="rp-to" type="date" value="' + esc(st.to) + '" title="To">';
  const monthBar = '<input id="rp-month" type="month" value="' + esc(st.month) + '" style="max-width:180px">';
  const bars = {
    collection: dateBar,
    dues: '<input id="rp-month" type="month" value="' + esc(st.month) + '" style="max-width:180px" title="Leave empty for all months"><button class="btn" id="rp-allm">All months</button>',
    attendance: dateBar + '<input id="rp-th" type="number" min="1" max="100" value="' + esc(st.threshold) + '" style="max-width:120px" title="Flag students below this %">',
    teacherpay: monthBar
  };

  main.innerHTML = '<div class="head"><div><h1>Reports</h1><p>Read-only summaries of money, dues and attendance.</p></div></div>' +
    '<div class="tabs" role="tablist">' + tabs.map(t => '<button role="tab" aria-selected="' + (t[0] === st.tab) + '" data-rt="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>' +
    '<div class="toolbar">' + bars[st.tab] + '</div><div id="rp-out"></div>';
  $$('[data-rt]', main).forEach(b => b.addEventListener('click', () => go('reports', b.dataset.rt)));

  const out = $('#rp-out');
  const stat = (v, l) => '<div class="card stat"><b>' + v + '</b><span>' + l + '</span></div>';
  const table = (head, rows) => '<div class="tablewrap"><table class="stack"><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows + '</tbody></table></div>';

  const renderers = {
    collection: async () => {
      const r = await api('reports.collection', { from: st.from, to: st.to });
      out.innerHTML = '<div class="stats">' + stat(fmt(r.total), 'Collected') + stat(r.count, 'Payments') + '</div>' +
        '<div class="section" style="margin-top:0"><h2>By month</h2>' + (r.months.length ? table(['Month', 'Amount'], r.months.map(m => '<tr><td data-l="Month">' + esc(m.MonthLabel) + '</td><td data-l="Amount"><b>' + fmt(m.Amount) + '</b></td></tr>').join('')) : '<div class="card empty"><b>No payments in this range</b></div>') + '</div>' +
        '<div class="section"><h2>By payment mode</h2>' + (r.modes.length ? table(['Mode', 'Amount'], r.modes.map(m => '<tr><td data-l="Mode">' + esc(m.Mode) + '</td><td data-l="Amount"><b>' + fmt(m.Amount) + '</b></td></tr>').join('')) : '<p class="muted">—</p>') + '</div>';
    },
    dues: async () => {
      const r = await api('reports.dues', { month: st.month });
      out.innerHTML = '<div class="stats">' + stat(r.totals.students, 'Students with dues') + stat(fmt(r.totals.balance), 'Outstanding') + stat(fmt(r.totals.overdue), 'Overdue') + '</div>' +
        (r.rows.length ? table(['Student', 'Class', 'Phone', 'Invoices', 'Unpaid for', 'Oldest due', 'Overdue', 'Balance'],
          r.rows.map(x => '<tr class="click" data-st="' + esc(x.StudentID) + '"><td data-l="Student"><b>' + esc(x.StudentName) + '</b><div class="muted" style="font-size:.82rem">' + esc(x.StudentID) + '</div></td><td data-l="Class">' + esc(x.CurrentClass) + '</td><td data-l="Phone">' + esc(x.Phone || '—') + '</td><td data-l="Invoices">' + x.Invoices + '</td><td data-l="Unpaid for">' + esc(x.Subjects || '—') + '</td><td data-l="Oldest due">' + esc(fmtDate(x.OldestDue) || '—') + '</td><td data-l="Overdue">' + (x.Overdue ? '<span class="pill bad">' + fmt(x.Overdue) + '</span>' : '—') + '</td><td data-l="Balance"><b>' + fmt(x.Balance) + '</b></td></tr>').join(''))
          : '<div class="card empty"><b>No dues</b>Everyone is paid up for this selection.</div>');
      $$('[data-st]', out).forEach(tr => tr.addEventListener('click', () => go('student', tr.dataset.st)));
    },
    attendance: async () => {
      const r = await api('reports.attendance', { from: st.from, to: st.to, threshold: st.threshold });
      out.innerHTML = '<div class="section" style="margin-top:0"><h2>By batch</h2>' +
        (r.batches.length ? table(['Batch', 'Records', 'Present', 'Late', 'Absent', 'Attendance'],
          r.batches.map(b => '<tr><td data-l="Batch"><b>' + esc(b.BatchName) + '</b></td><td data-l="Records">' + b.Sessions + '</td><td data-l="Present">' + b.Present + '</td><td data-l="Late">' + b.Late + '</td><td data-l="Absent">' + b.Absent + '</td><td data-l="Attendance"><div class="row"><b style="min-width:42px">' + b.Pct + '%</b><div class="bar" style="flex:1"><i style="width:' + b.Pct + '%"></i></div></div></td></tr>').join(''))
          : '<div class="card empty"><b>No attendance in this range</b></div>') + '</div>' +
        '<div class="section"><h2>Active students below ' + r.threshold + '%</h2>' +
        (r.lowStudents.length ? table(['Student', 'Class', 'Records', 'Absent', 'Attendance'],
          r.lowStudents.map(x => '<tr class="click" data-st="' + esc(x.StudentID) + '"><td data-l="Student"><b>' + esc(x.StudentName) + '</b><div class="muted" style="font-size:.82rem">' + esc(x.StudentID) + '</div></td><td data-l="Class">' + esc(x.CurrentClass) + '</td><td data-l="Records">' + x.Sessions + '</td><td data-l="Absent">' + x.Absent + '</td><td data-l="Attendance"><span class="pill bad">' + x.Pct + '%</span></td></tr>').join(''))
          : '<p class="muted">Nobody is below the line.</p>') + '</div>';
      $$('[data-st]', out).forEach(tr => tr.addEventListener('click', () => go('student', tr.dataset.st)));
    },
    teacherpay: async () => {
      const r = await api('reports.teacherPay', { month: st.month });
      out.innerHTML = '<div class="stats">' + stat(fmt(r.totals.payable), 'Payable') + stat(fmt(r.totals.paid), 'Paid') + stat(fmt(r.totals.balance), 'Still to pay') + '</div>' +
        (r.rows.length ? table(['Teacher', 'Subjects', 'Students', 'Payable', 'Paid', 'Balance'],
          r.rows.map(x => '<tr><td data-l="Teacher"><b>' + esc(x.TeacherName) + '</b></td><td data-l="Subjects">' + x.Subjects + '</td><td data-l="Students">' + x.Students + '</td><td data-l="Payable">' + fmt(x.Payable) + '</td><td data-l="Paid">' + fmt(x.Paid) + '</td><td data-l="Balance"><b>' + fmt(x.Balance) + '</b></td></tr>').join(''))
          : '<div class="card empty"><b>No teacher income for this month</b>Generate it first under Teacher income.</div>');
    }
  };

  const run = () => renderers[st.tab]().catch(fail);
  const bind = (id, key, conv) => { const el = $(id); if (el) el.addEventListener('change', e => { st[key] = conv ? conv(e.target.value) : e.target.value; run(); }); };
  bind('#rp-from', 'from'); bind('#rp-to', 'to'); bind('#rp-month', 'month');
  bind('#rp-th', 'threshold', v => Math.min(100, Math.max(1, parseInt(v, 10) || 75)));
  const allm = $('#rp-allm'); if (allm) allm.addEventListener('click', () => { st.month = ''; $('#rp-month').value = ''; run(); });
  await run();
};

/* ---------- notices ---------- */
function audienceLabel_(aud, batchName) {
  const a = String(aud || 'ALL').toUpperCase();
  if (a === 'BATCH')     return batchName ? 'Batch · ' + batchName : 'One batch';
  if (a === 'STUDENTS')  return 'All students';
  if (a === 'TEACHERS')  return 'Teachers only';
  return 'Everyone';
}

VIEWS.notices = async main => {
  await loadLookups();
  const edit = can('NOTICE_EDIT');
  const st = VIEWS.notices.state = VIEWS.notices.state || { filter: 'active' };

  main.innerHTML =
    '<div class="head"><div><h1>Notices</h1><p>Announcements shown to students and staff</p></div>' +
      (edit ? '<button class="btn primary" id="nt-add">Post notice</button>' : '') + '</div>' +
    '<div class="toolbar">' +
      '<select id="nt-filter">' +
        '<option value="active"'   + (st.filter === 'active'   ? ' selected' : '') + '>Active only</option>' +
        '<option value=""'         + (st.filter === ''         ? ' selected' : '') + '>All notices</option>' +
        '<option value="inactive"' + (st.filter === 'inactive' ? ' selected' : '') + '>Inactive only</option>' +
        '<option value="expired"'  + (st.filter === 'expired'  ? ' selected' : '') + '>Expired</option>' +
      '</select>' +
    '</div>' +
    '<div id="nt-list"></div>';

  const load = async () => {
    const rows = await api('notices.adminList');
    const today = new Date().toISOString().slice(0, 10);
    const filtered = rows.filter(r => {
      const isExp = r.ExpiresAt && r.ExpiresAt < today;
      if (st.filter === 'active')   return String(r.Status).toUpperCase() === 'ACTIVE' && !isExp;
      if (st.filter === 'inactive') return String(r.Status).toUpperCase() === 'INACTIVE';
      if (st.filter === 'expired')  return !!isExp;
      return true;
    });

    $('#nt-list').innerHTML = filtered.length
      ? '<div class="tablewrap"><table class="stack"><thead><tr>' +
          '<th>Title</th><th>Audience</th><th>Landing page</th><th>Posted</th><th>Expires</th><th>Status</th><th></th>' +
        '</tr></thead><tbody>' +
        filtered.map(r => {
          const isExp = r.ExpiresAt && r.ExpiresAt < today;
          const statusPill = isExp ? '<span class="pill warn">Expired</span>' : pill(r.Status);
          const isActive = String(r.Status).toUpperCase() === 'ACTIVE';
          return '<tr>' +
            '<td data-l="Title"><b>' + esc(r.Title) + '</b></td>' +
            '<td data-l="Audience">' + esc(audienceLabel_(r.Audience, r.BatchName)) + '</td>' +
            '<td data-l="Landing page">' + (r.ShowOnLandingPage ? '<span class="pill ok">Public</span>' : '<span class="muted">Portal only</span>') + '</td>' +
            '<td data-l="Posted">' + esc(r.PostedAt ? fmtTime(r.PostedAt) : '—') + '</td>' +
            '<td data-l="Expires">' + esc(r.ExpiresAt ? fmtDate(r.ExpiresAt) : '—') + '</td>' +
            '<td>' + statusPill + '</td>' +
            '<td>' + (edit
              ? '<button class="btn small" data-edit="' + esc(r.NoticeID) + '">Edit</button> ' +
                '<button class="btn small ' + (isActive ? 'danger' : '') + '" data-toggle="' + esc(r.NoticeID) + '">' +
                  (isActive ? 'Deactivate' : 'Activate') + '</button>'
              : '') + '</td>' +
          '</tr>';
        }).join('') +
      '</tbody></table></div>'
      : '<div class="card empty"><b>No notices here</b>' +
        (edit ? 'Use “Post notice” to create one.' : '') + '</div>';

    if (edit) {
      $$('[data-edit]', main).forEach(b => b.addEventListener('click', () => {
        noticeDialog(rows.find(x => x.NoticeID === b.dataset.edit));
      }));
      $$('[data-toggle]', main).forEach(b => b.addEventListener('click', () => {
        const r = rows.find(x => x.NoticeID === b.dataset.toggle);
        const isActive = String(r.Status).toUpperCase() === 'ACTIVE';
        if (!confirm((isActive ? 'Deactivate' : 'Activate') + ' “' + r.Title + '”?')) return;
        busy(b, async () => {
          try {
            await api('notices.setStatus', { id: r.NoticeID, status: isActive ? 'Inactive' : 'Active' });
            toast('Saved.'); await load();
          } catch (e) { fail(e); }
        });
      }));
    }
  };

  const noticeDialog = (row) => {
    const isEdit = !!row;
    const V = (k, def) => esc(row && row[k] != null ? row[k] : (def || ''));
    const aud = String((row && row.Audience) || 'STUDENTS').toUpperCase();
    const stat = String((row && row.Status) || 'Active');
    const formHtml = '<form>' +
      '<label class="f full"><span>Title <em style="color:var(--bad);font-style:normal">*</em></span>' +
        '<input name="Title" type="text" maxlength="150" required autocomplete="off" value="' + V('Title', '') + '">' +
      '</label>' +
      '<label class="f full"><span>Message <em style="color:var(--bad);font-style:normal">*</em></span>' +
        '<textarea name="Body" required rows="6" style="width:100%;padding:.55rem .75rem;border:1px solid #c5d1e0;border-radius:8px;font:inherit;min-height:130px">' + V('Body', '') + '</textarea>' +
      '</label>' +
      '<div class="grid2">' +
        '<label class="f"><span>Audience <em style="color:var(--bad);font-style:normal">*</em></span>' +
          '<select name="Audience" required>' +
            ['STUDENTS', 'BATCH', 'TEACHERS', 'ALL'].map(a =>
              '<option value="' + a + '"' + (aud === a ? ' selected' : '') + '>' + esc(audienceLabel_(a, '')) + '</option>'
            ).join('') +
          '</select>' +
        '</label>' +
        '<label class="f" data-batchwrap><span>Batch</span>' +
          '<select name="BatchID">' +
            '<option value="">Choose a batch</option>' +
            activeOnly('batches').map(b =>
              '<option value="' + esc(b.BatchID) + '"' + (row && row.BatchID === b.BatchID ? ' selected' : '') + '>' + esc(b.BatchName + ' (' + b.Class + ')') + '</option>'
            ).join('') +
          '</select>' +
        '</label>' +
        '<label class="f"><span>Expires on</span>' +
          '<input name="ExpiresAt" type="date" value="' + V('ExpiresAt', '') + '">' +
          '<small>Leave blank for no expiry.</small>' +
        '</label>' +
        '<label class="f"><span>Status</span>' +
          '<select name="Status" required>' +
            '<option value="Active"' + (stat === 'Active' ? ' selected' : '') + '>Active</option>' +
            '<option value="Inactive"' + (stat === 'Inactive' ? ' selected' : '') + '>Inactive</option>' +
          '</select>' +
        '</label>' +
        '<label class="f full"><span><input name="ShowOnLandingPage" type="checkbox" style="width:auto;min-height:0;padding:0;margin-right:.5rem;accent-color:var(--navy)"' + (row && row.ShowOnLandingPage ? ' checked' : '') + '>Show on public landing page</span>' +
          '<small>Only use this for a notice meant for everyone. Batch-only or staff notices can never be shown publicly.</small></label>' +
      '</div>' +
    '</form>';

    openDlg(isEdit ? 'Edit notice' : 'Post notice',
      formHtml,
      '<button class="btn" type="button" data-close>Cancel</button>' +
      '<button class="btn primary" id="nt-save">' + (isEdit ? 'Save changes' : 'Post notice') + '</button>',
      d => {
        const audSel = d.querySelector('[name=Audience]');
        const batchWrap = d.querySelector('[data-batchwrap]');
        const publicCheck = d.querySelector('[name=ShowOnLandingPage]');
        const syncBatch = () => { batchWrap.style.display = (audSel.value === 'BATCH') ? '' : 'none'; };
        const syncPublic = () => {
          const everyone = audSel.value === 'ALL';
          publicCheck.disabled = !everyone;
          if (!everyone) publicCheck.checked = false;
        };
        audSel.addEventListener('change', syncBatch);
        audSel.addEventListener('change', syncPublic);
        syncBatch(); syncPublic();

        $('#nt-save', d).addEventListener('click', ev => busy(ev.target, async () => {
          if (!validForm(d)) return;
          const fields = [{ n: 'Title' }, { n: 'Body' }, { n: 'Audience' }, { n: 'BatchID' }, { n: 'ExpiresAt' }, { n: 'Status' }];
          const data = collect(d, fields);
          data.ShowOnLandingPage = d.querySelector('[name=ShowOnLandingPage]').checked ? 'TRUE' : 'FALSE';
          try {
            if (isEdit) {
              const ch = changedOnly(data, row);
              if (!Object.keys(ch).length) { toast('Nothing has changed.'); return; }
              await api('notices.update', { id: row.NoticeID, changes: ch });
            } else {
              await api('notices.add', { item: data });
            }
            closeDlg();
            toast('Saved.');
            await load();
          } catch (e) { fail(e); }
        }));
      });
  };

  $('#nt-filter').addEventListener('change', e => { st.filter = e.target.value; load().catch(fail); });
  if (edit) $('#nt-add').addEventListener('click', () => noticeDialog(null));

  await load();
};

/* ---------- settings ---------- */
VIEWS.settings = async main => {
  const rows = await api('settings.get'), edit = can('SETTINGS_EDIT');
  await loadLookups();
  const superAdmin=S.user&&S.user.role==='SUPER_ADMIN';
  let driveConnections=[];
  if(superAdmin){
    const params=new URLSearchParams(location.search),code=params.get('drive_code'),state=params.get('drive_state');
    if(code&&state){
      const cfg=window.CMZ_CONFIG||{};
      const complete=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/functions/v1/google-drive-oauth',{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.supabasePublishableKey,Authorization:'Bearer '+S.token},body:JSON.stringify({code,state})});
      const result=await complete.json();
      if(!complete.ok)throw {error:result.error||'Could not connect Google Drive.'};
      history.replaceState(null,'',location.pathname);toast('Google Drive connected: '+result.email);
    }
    driveConnections=await api('drive.connections.list');
  }
  main.innerHTML = '<div class="head"><div><h1>Settings</h1><p>Changes apply straight away. Nothing else needs editing in the code.</p></div>' + (edit ? '<button class="btn primary" id="set-save">Save changes</button>' : '') + '</div>' +
    '<div class="card"><form id="set-f">' + rows.map(r => '<label class="f"><span>' + esc(r.description || r.key) + '</span><input name="' + esc(r.key) + '" value="' + esc(r.value) + '"' + (edit ? '' : ' readonly') + '><small>' + esc(r.key) +
      (r.key === 'SUBJECT_BLOCKED_PAIRS' ? ' — subject IDs: ' + L('subjects').map(s => s.SubjectID + ' = ' + s.SubjectName).join(', ') : '') + '</small></label>').join('') + '</form></div>' +
    (superAdmin?'<section class="section"><h2>Homework file archive</h2><div class="card"><p>Connect the centre Google account used to archive homework and student submissions after deadlines. Older accounts stay connected so archived files remain available. Use transfer to move an old account’s archive to the current account; it disconnects the old account after all files move.</p><div id="drive-connections">'+(driveConnections.length?driveConnections.map(c=>'<div class="row" style="padding:.65rem 0;border-top:1px solid var(--line)"><b>'+esc(c.account_email)+'</b><span class="pill '+(c.is_primary?'ok':'')+'">'+(c.is_primary?'Current archive account':'Previous archive account')+'</span>'+(c.is_primary?'':'<button class="btn small" data-drive-transfer="'+esc(c.id)+'">Transfer archive and disconnect</button>')+'</div>').join(''):'<p class="muted">No Google Drive account connected yet.</p>')+'</div><button class="btn primary" id="drive-connect">Connect / change Google account</button><p class="muted" style="margin-bottom:0">Files remain in Supabase if Drive is not connected or an upload fails. Drive copies are kept until a teacher deletes them from the homework page.</p></div></section>':'');
  if(superAdmin){
    $('#drive-connect').addEventListener('click',ev=>busy(ev.target,async()=>{const result=await api('drive.oauthStart');location.href=result.url;}));
    $$('[data-drive-transfer]',main).forEach(button=>button.addEventListener('click',()=>{const primary=driveConnections.find(c=>c.is_primary);if(!primary){fail({error:'Connect the new Google Drive account first.'});return;}if(!confirm('Copy this old account’s archived homework files into '+primary.account_email+'? The old connection will be removed after every file transfers.'))return;busy(button,async()=>{const cfg=window.CMZ_CONFIG||{},res=await fetch(cfg.supabaseUrl.replace(/\/$/,'')+'/functions/v1/homework-drive',{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.supabasePublishableKey,Authorization:'Bearer '+S.token},body:JSON.stringify({action:'transfer',sourceConnectionId:button.dataset.driveTransfer,targetConnectionId:primary.id})}),data=await res.json();if(!res.ok)throw {error:data.error||'Transfer failed.'};toast(data.transferred+' archived file(s) transferred; '+data.remaining+' remaining.');go('settings');});}));
  }
  if (edit) $('#set-save').addEventListener('click', ev => busy(ev.target, async () => {
    const orig = {}; rows.forEach(r => { orig[r.key] = r.value; });
    const cur = {}; $$('#set-f input').forEach(i => { cur[i.name] = i.value.trim(); });
    const ch = changedOnly(cur, orig);
    if (!Object.keys(ch).length) { toast('Nothing has changed.'); return; }
    await api('settings.update', { changes: ch }); S.cfg = await api('public.config'); toast('Settings saved.'); go('settings');
  }));
};

  $$('[data-pm]', main).forEach(b => b.addEventListener('click', () => { const u = admins.find(x => x.UserID === b.dataset.pm), have = userExtraPermissions(u.ExtraPermissions);

      d => $('#pm-save', d).addEventListener('click', ev => busy(ev.target, async () => {

/* ---------- live updates ----------
   The server keeps a "data changed" stamp. Every 30 seconds (while this tab is visible) the page asks for it.
   If something changed (a payment, a registration, a student marking attendance...) the current page is
   redrawn quietly. It never redraws while a dialog is open, while you are typing, or just after you clicked. */
const SYNC = { v: null, l: null, timer: null, busy: false, pending: false, stale: false, lastInput: 0 };
const SYNC_MS = 30000;
const NO_LIVE = ['settings', 'student']; // pages with edit forms: tell the user instead of redrawing

['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { SYNC.lastInput = Date.now(); }, true));

function liveState(text, stale) {
  const box = $('#live'); if (!box) return;
  box.classList.toggle('stale', !!stale);
  $('#live-text').textContent = text;
}
const clockNow = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

async function liveRefresh() {
  const main = $('#main'), y = window.scrollY;
  main.classList.add('quiet');
  SYNC.pending = false; SYNC.stale = false;
  try { await (VIEWS[S.view] || VIEWS.dashboard)(main, S.arg); } catch (e) { fail(e); }
  window.scrollTo(0, y);
  liveState('Updated ' + clockNow());
}

async function applyLive() {
  const ae = document.activeElement;
  const typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) && $('#main').contains(ae);
  if ($('#dlg').open || typing || Date.now() - SYNC.lastInput < 4000) { SYNC.pending = true; return; }
  if (NO_LIVE.indexOf(S.view) >= 0) { SYNC.stale = true; SYNC.pending = false; liveState('New changes · refresh', true); return; }
  await liveRefresh();
}

async function syncTick() {
  if (!S.token || document.hidden || SYNC.busy) return;
  SYNC.busy = true;
  try {
    const prevV = SYNC.v, prevL = SYNC.l;
    const r = await api('sync.version');
    const dataChanged = prevV !== null && r.v !== prevV;
    const logChanged = prevL !== null && r.l !== prevL;
    const logPage = S.view === 'logs' || S.view === 'users';
    if (dataChanged) refreshRegBadge();
    if (dataChanged || (logPage && logChanged) || SYNC.pending) await applyLive();
    else if (!SYNC.stale) liveState('Updated ' + clockNow());
  } catch (e) {
    if (e && SESSION_CODES.indexOf(e.code) >= 0) fail(e); // a dropped connection is ignored; the next check tries again
  } finally { SYNC.busy = false; }
}

function startLive() { stopLive(); liveState('Live'); SYNC.timer = setInterval(syncTick, SYNC_MS); }
function stopLive() { if (SYNC.timer) { clearInterval(SYNC.timer); SYNC.timer = null; } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token && SYNC.timer) syncTick(); });
$('#live-btn').addEventListener('click', () => busy($('#live-btn'), () => liveRefresh()));

/* ---------- start ---------- */
(async function init() {
  try { const c = await api('public.config'); S.cfg = c; if (window.cmzHero) cmzHero($('#hero-slot'), c.logoUrl);
    ['#lg-centre', '#nav-centre', '#tb-centre'].forEach(s => { $(s).textContent = c.centreName; });
    if (c.logoUrl) {
      const lgLogo = $('#lg-logo'); if (lgLogo) cmzSetLogo(lgLogo, c.logoUrl);
      const navLogo = $('#nav-logo'); if (navLogo) cmzSetLogo(navLogo, c.logoUrl);
      const badge = $('#nav-logo-badge'); if (badge) badge.style.display = 'flex';
    } else {
      cmzSetLogo($('#lg-logo'), ''); cmzSetLogo($('#nav-logo'), '');
      const badge = $('#nav-logo-badge'); if (badge) badge.style.display = 'flex';
    }
    if (c.tagline) $('#lg-tagline').textContent = c.tagline;
    document.title = c.centreName + ' · Admin';
  } catch (e) { /* login still works if config fails */ }
  let saved = null; try { saved = sessionStorage.getItem('cmz_t'); } catch (e) {}
  if (saved) {
    S.token = saved;
    try { const me = await api('auth.me'); S.user = { userId: me.userId, username: me.username, role: me.role, userType: me.userType, displayName: (me.profile && me.profile.Name) || me.username, mustChangePassword: me.mustChangePassword };
      if (me.userType !== 'ADMIN') throw { code: 'SESSION_EXPIRED' };
      S.perms = me.permissions; if (me.mustChangePassword) { show('forcepw'); } else startApp(); return; }
    catch (e) { S.token = null; try { sessionStorage.removeItem('cmz_t'); } catch (x) {} }
  }
  show('login');
})();
</script>
