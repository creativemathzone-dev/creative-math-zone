<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16243b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<script src="./pwa.js" defer></script>
<script src="config.js"></script>
<title>Creative Math Zone · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f8fb; --card:#ffffff; --ink:#18263d; --ink-2:#4a5a73; --ink-3:#7b8aa0;
  --line:#dde5ef; --grid:#dbe7f3; --navy:#16243b; --navy-2:#223654;
  --pencil:#f3b11c; --pencil-dk:#b97f00; --ok:#1f7a55; --ok-bg:#e3f4ec; --bad:#b3302a; --bad-bg:#fbe9e7; --warn-bg:#fff3d6;
  --r:10px; --shadow:0 1px 2px rgba(22,36,59,.06),0 4px 14px rgba(22,36,59,.06);
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:42px;padding:.55rem 1rem;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.btn.danger{color:var(--bad);border-color:#e8bcb8}
.btn.small{min-height:34px;padding:.3rem .7rem;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:wait}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:600;text-decoration:underline;cursor:pointer}

/* ---------- sign-in ---------- */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.sheet{position:relative;background:#fbfdff;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:3rem;overflow:hidden}
.sheet svg{position:absolute;inset:0;width:100%;height:100%}
.sheet .axis{stroke:var(--navy);stroke-width:2}
.sheet .curve{fill:none;stroke:var(--pencil);stroke-width:5;stroke-linecap:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.2s .3s ease-out forwards}
.sheet .dot{fill:var(--navy)}
@keyframes draw{to{stroke-dashoffset:0}}
.sheet .tag{position:relative;max-width:20ch;font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,3.2vw,2.8rem);color:var(--navy);background:rgba(251,253,255,.88);padding:.4rem .6rem .5rem 0}
.sheet .tag small{display:block;font:500 1rem var(--body);color:var(--ink-2);margin-top:.5rem}
.signin{display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
.signin form{width:100%;max-width:370px}
.signin h1{font-size:2rem;margin-bottom:.35rem}
.signin p{color:var(--ink-2);margin:0 0 1.5rem}
.alert{border-radius:8px;padding:.7rem .9rem;margin:0 0 1rem;font-size:.95rem}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:#6b4c00}
.alert.ok{background:var(--ok-bg);color:var(--ok)}

/* ---------- fields ---------- */
.f{display:block;margin-bottom:1rem}
.f>span{display:block;font-size:.88rem;font-weight:600;color:var(--ink-2);margin-bottom:.3rem}
.f>span em{color:var(--bad);font-style:normal}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:.55rem .75rem;border:1px solid #c5d1e0;border-radius:8px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy);outline:3px solid rgba(243,177,28,.45);outline-offset:0}
.f small{display:block;color:var(--ink-3);font-size:.82rem;margin-top:.25rem}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:6px;min-height:32px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.grid2 .full{grid-column:1/-1}

/* ---------- app shell ---------- */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav.side{background:var(--navy);color:#dbe5f5;padding:1rem .75rem .75rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
nav.side .brand{flex-shrink:0}
nav.side #nav-items{flex:1;overflow-y:auto;overflow-x:hidden;margin-bottom:.5rem;scrollbar-width:thin}
nav.side #nav-items::-webkit-scrollbar{width:6px}
nav.side #nav-items::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
nav.side .who{flex-shrink:0}
nav.side .brand{padding:.25rem .75rem 1.25rem;font-family:var(--display);font-weight:700;font-size:1.15rem;color:#fff;line-height:1.15;letter-spacing:-.015em}
nav.side .brand .logo-badge{display:none;width:58px;height:58px;border-radius:50%;background:#fff;align-items:center;justify-content:center;margin:0 0 .7rem;box-shadow:0 2px 10px rgba(0,0,0,.25),inset 0 0 0 3px rgba(22,36,59,.08)}
nav.side .brand .logo-badge img{width:46px;height:46px;object-fit:contain;border-radius:50%;display:block}
nav.side .brand small{display:block;font:500 .78rem var(--body);color:#9fb2d0;margin-top:.3rem}
nav.side button.item{display:flex;width:100%;align-items:center;gap:.6rem;text-align:left;background:none;border:0;border-left:4px solid transparent;color:inherit;padding:.65rem .75rem;border-radius:0 8px 8px 0;cursor:pointer;font-weight:500}
nav.side button.item:hover{background:rgba(255,255,255,.07)}
nav.side button.item[aria-current=page]{background:rgba(255,255,255,.1);border-left-color:var(--pencil);color:#fff;font-weight:600}
nav.side .who{margin-top:auto;padding:.75rem;border-top:1px solid rgba(255,255,255,.14);font-size:.9rem}
nav.side .who b{display:block;color:#fff}
nav.side .who .btn{margin-top:.6rem;width:100%;background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.topbar{display:none}
main{padding:2rem clamp(1rem,3vw,2.5rem) 4rem;max-width:1200px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.head h1{font-size:1.9rem}
.head p{margin:.25rem 0 0;color:var(--ink-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1.25rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat b{display:block;font:700 2.2rem/1 var(--display);color:var(--navy)}
.stat span{color:var(--ink-2);font-size:.92rem}
.toolbar{display:flex;gap:.75rem;flex-wrap:wrap;margin-bottom:1rem}
.toolbar input,.toolbar select{min-height:42px;padding:.4rem .75rem;border:1px solid #c5d1e0;border-radius:8px;background:#fff}
.toolbar input{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{text-align:left;padding:.7rem .85rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--ink-2);font-weight:600;background:#f1f5fa}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#f6faff}
.tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--shadow);background:#fff}
.pill{display:inline-block;padding:.1rem .6rem;border-radius:99px;font-size:.82rem;font-weight:600;background:#e8eef6;color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:#6b4c00}
.muted{color:var(--ink-3)}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--ink-2)}
.empty b{display:block;font:700 1.15rem var(--display);color:var(--ink);margin-bottom:.3rem}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1.25rem;overflow:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.65rem 1rem;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--pencil)}
.bar{height:10px;background:#e8eef6;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.steps{margin:0;padding-left:1.2rem;color:var(--ink-2)}
.steps li{margin:.35rem 0}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.kv{display:grid;grid-template-columns:150px 1fr;gap:.35rem 1rem;margin:0}
.kv dt{color:var(--ink-3);font-size:.9rem}.kv dd{margin:0}
.section{margin-top:1.75rem}
.section>h2{font-size:1.2rem;margin-bottom:.75rem}
.perm{display:flex;gap:.6rem;align-items:flex-start;padding:.45rem 0;border-bottom:1px solid var(--line)}
.perm input{margin-top:.3rem;width:18px;height:18px}

main.quiet>*{animation:none!important}
.live{display:flex;align-items:center;gap:.5rem;padding:.45rem .75rem;font-size:.8rem;color:#9fb2d0;flex-shrink:0}
.live .dot{width:8px;height:8px;border-radius:50%;background:#52e0a1;flex:none;animation:livepulse 2.4s ease-in-out infinite}
.live.stale .dot{background:var(--pencil);animation:none}
.live.stale #live-text{color:#ffd25a}
.live .link{color:#fff;margin-left:auto;font-size:.8rem}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(82,224,161,.55)}50%{box-shadow:0 0 0 5px rgba(82,224,161,0)}}
.badge{margin-left:auto;background:var(--pencil);color:var(--navy);border-radius:99px;padding:0 .5rem;font-size:.78rem;font-weight:700;line-height:1.5}
textarea[readonly]{background:#f8fafc}

/* ---------- dialog + toast ---------- */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(10,20,40,.35)}
dialog::backdrop{background:rgba(16,28,48,.55)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:1.25rem}
.dlg-b{padding:1.25rem;overflow:auto;max-height:calc(92vh - 130px)}
.dlg-f{display:flex;justify-content:flex-end;gap:.6rem;padding:.9rem 1.25rem;border-top:1px solid var(--line);background:#f8fafc}
.cred{background:#f1f5fa;border:1px dashed #9fb2d0;border-radius:10px;padding:1rem;margin:1rem 0}
.cred div{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.3rem 0}
.cred code{font:600 1.25rem/1.2 ui-monospace,Consolas,monospace;letter-spacing:.04em;word-break:break-all}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none;width:min(560px,92vw)}
#toast div{pointer-events:auto;padding:.7rem 1rem;border-radius:9px;background:var(--navy);color:#fff;box-shadow:var(--shadow);font-weight:500}
#toast div.bad{background:var(--bad)}

@media print {
  html, body { background: #fff !important; margin: 0 !important; padding: 0 !important; }
  body * { visibility: hidden; }
  #app, main { display: block !important; padding: 0 !important; margin: 0 !important; grid-template-columns: none !important; min-height: 0 !important; }
  nav.side, .topbar, .no-print, #toast, dialog, #login, #forcepw { display: none !important; }
  #receipt-paper, #receipt-paper * { visibility: visible; }
  #receipt-paper {
    position: static !important;
    display: block !important;
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    box-shadow: none !important;
    border: 0 !important;
    page-break-inside: avoid;
    page-break-after: avoid;
  }
  @page { size: A5; margin: 6mm; }
}

@media (max-width:900px){
  #login{grid-template-columns:1fr}
  .sheet{min-height:200px;padding:1.5rem;border-right:0;border-bottom:1px solid var(--line)}
  .sheet .tag{font-size:1.5rem}
  .sheet .tag small{display:none}
  #app{grid-template-columns:1fr}
  nav.side{position:fixed;inset:0 25% 0 0;z-index:40;height:100vh;transform:translateX(-102%);transition:transform .2s}
  nav.side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:.75rem;background:var(--navy);color:#fff;padding:.6rem 1rem;position:sticky;top:0;z-index:30}
  .topbar b{font-family:var(--display)}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;min-height:38px;padding:0 .8rem;font-weight:600}
  .grid2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  .head h1{font-size:1.5rem}
  /* tables become stacked cards on phones */
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border-bottom:8px solid var(--paper);padding:.4rem 0}
  table.stack td{border:0;padding:.25rem .85rem}
  table.stack td[data-l]::before{content:attr(data-l) ": ";color:var(--ink-3);font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){.sheet .curve{animation:none;stroke-dashoffset:0}nav.side{transition:none}}
</style>
<style>
/* ===== Creative Math Zone: shared logo + motion (included by every page) ===== */
@keyframes cmz-spin{to{transform:rotate(360deg)}}
@keyframes cmz-fade{from{opacity:0}to{opacity:1}}
@keyframes cmz-enter{from{opacity:0;transform:scale(.2) rotate(-200deg)}to{opacity:1;transform:none}}
@keyframes cmz-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2%)}}
@keyframes cmz-glow{0%,100%{box-shadow:0 0 0 4px rgba(243,177,28,.9),0 0 50px 4px rgba(243,177,28,.35),0 24px 60px rgba(0,0,0,.45)}
  50%{box-shadow:0 0 0 4px #ffd25a,0 0 90px 14px rgba(243,177,28,.6),0 24px 60px rgba(0,0,0,.45)}}
@keyframes cmz-glow-sm{0%,100%{box-shadow:0 0 0 2px rgba(243,177,28,.85),0 0 10px rgba(243,177,28,.3)}50%{box-shadow:0 0 0 2px #ffd25a,0 0 20px rgba(243,177,28,.65)}}
@keyframes cmz-shine{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes cmz-tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1.3)}}
@keyframes cmz-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cmz-splash-out{to{opacity:0;visibility:hidden}}

/* ---- animated logo with orbiting symbols ---- */
.cmz-hero{--size:min(58vmin,460px);position:relative;width:var(--size);height:var(--size);flex:none}
.cmz-logo{position:absolute;inset:19%;border-radius:50%;overflow:hidden;z-index:3;background:#fff;
  box-shadow:0 0 0 4px rgba(243,177,28,.9),0 0 60px 6px rgba(243,177,28,.45),0 24px 60px rgba(0,0,0,.45);
  animation:cmz-enter 1.3s cubic-bezier(.2,.9,.25,1.15) both,cmz-float 7s ease-in-out 1.3s infinite,cmz-glow 3.6s ease-in-out 1.3s infinite}
.cmz-logo img{width:100%;height:100%;display:block;object-fit:cover}
.cmz-logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
  transform:translateX(-120%);animation:cmz-shine 6s ease-in-out 2.2s infinite}
.cmz-logo.noimg{background:linear-gradient(135deg,#2a56a8,#2ea88a)}
.cmz-logo.noimg img{display:none}
.cmz-logo.noimg::before{content:"CMZ";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 2.6rem/1 'Bricolage Grotesque','Segoe UI',sans-serif;letter-spacing:-.02em}
.cmz-halo{position:absolute;inset:16%;border-radius:50%;z-index:2;
  background:conic-gradient(from 0deg,transparent 0 55%,#f3b11c 80%,transparent 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
  animation:cmz-spin 5s linear infinite,cmz-fade 1s .8s both}
.cmz-orbit{position:absolute;inset:0;z-index:4;animation:cmz-spin var(--t) linear infinite,cmz-fade 1s .9s both}
.cmz-orbit.rev{animation-direction:reverse,normal}
.cmz-ring{position:absolute;inset:var(--in);border-radius:50%;border:1px dashed rgba(159,178,208,.28)}
.cmz-sym{position:absolute;top:50%;left:50%;width:0;height:0;
  transform:rotate(var(--a)) translateX(calc(var(--size) * var(--r))) rotate(calc(var(--a) * -1))}
.cmz-sym i{position:absolute;left:0;top:0;display:grid;place-items:center;width:calc(var(--size)*.105);height:calc(var(--size)*.105);
  margin:calc(var(--size)*-.0525) 0 0 calc(var(--size)*-.0525);
  font:700 calc(var(--size)*.075)/1 'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-style:normal;color:var(--c);
  text-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent);
  animation:cmz-spin var(--t) linear infinite reverse}
.cmz-orbit.rev .cmz-sym i{animation-direction:normal}
.cmz-tw{position:absolute;width:6px;height:6px;border-radius:50%;background:#f3b11c;z-index:1;opacity:0;animation:cmz-tw 3.2s ease-in-out infinite}

/* ---- sign-in pages: dark panel with the animated logo ---- */
.sheet{background-color:#0f1b30;
  background-image:radial-gradient(circle at 50% 42%,rgba(243,177,28,.2),transparent 56%),linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px;border-right:0}
.sheet .tag{color:#fff;background:transparent}
.sheet .tag small{color:#9fb2d0}
.cmz-hero-slot{position:absolute;left:0;right:0;top:0;bottom:130px;display:grid;place-items:center}
.sheet .cmz-hero{--size:min(50vmin,440px)}
#lg-logo{display:none!important}

/* ---- inside the portals ---- */
main>*{animation:cmz-rise .5s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}
main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(n+5){animation-delay:.2s}
nav.side .brand .logo-badge{animation:cmz-glow-sm 4s ease-in-out infinite}
nav.side .brand img#nav-logo{border-radius:50%!important;background:#fff;animation:cmz-glow-sm 4s ease-in-out infinite}
nav.side button.item{transition:background .15s,padding-left .15s}
nav.side button.item:hover{padding-left:1rem}
.btn{transition:transform .12s,border-color .15s,background .15s}
.btn:active{transform:scale(.97)}
.card.stat{transition:transform .18s,box-shadow .18s}
.card.stat:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(22,36,59,.08),0 12px 26px rgba(22,36,59,.12)}

/* ---- loader + welcome splash ---- */
.cmz-loader{display:grid;place-items:center;padding:4rem 0}
.cmz-loader i{width:44px;height:44px;border-radius:50%;border:4px solid #e8eef6;border-top-color:#f3b11c;animation:cmz-spin .8s linear infinite}
#cmz-splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;text-align:center;color:#fff;cursor:pointer;
  background:radial-gradient(circle at 50% 45%,#1d3558,#0f1b30 70%);animation:cmz-splash-out .45s ease 1.25s forwards}
#cmz-splash p{margin:1.2rem 0 0;font:700 1.5rem/1.2 'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;animation:cmz-fade .6s .5s both}
#cmz-splash .cmz-logo{position:relative;inset:auto;width:132px;height:132px;margin:0 auto}

@media (max-width:900px){
  .sheet{min-height:270px;padding:1rem}
  .sheet .tag{display:none}
  .cmz-hero-slot{bottom:0}
  .sheet .cmz-hero{--size:min(62vw,236px)}
}
@media print{main>*{animation:none!important}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .cmz-orbit,.cmz-sym i,.cmz-halo{animation:none!important}
}
</style>
<script>
/* Builds the animated logo inside el. logoUrl may be empty (shows initials). */
var CMZ_ORBITS = [
  { t: 46, inset: '7%',  rev: false, r: .405, off: 0,  syms: [['π', '#f3b11c'], ['∞', '#52e0a1'], ['Σ', '#ff7aa8'], ['√', '#7ba7f5'], ['∫', '#ffd25a']] },
  { t: 70, inset: '-1%', rev: true,  r: .5,   off: 36, syms: [['÷', '#ffffff'], ['θ', '#7ba7f5'], ['%', '#f3b11c'], ['≈', '#52e0a1'], ['x²', '#ff7aa8']] }
];
var CMZ_SPARKS = [[6, 30, .2], [14, 84, 1.1], [72, 92, 2], [90, 62, .7], [80, 8, 1.7], [34, 2, 2.4]];

function cmzHero(el, logoUrl) {
  if (!el) return;
  var h = '<div class="cmz-hero" role="img" aria-label="Creative Math Zone logo"><div class="cmz-halo"></div>';
  CMZ_ORBITS.forEach(function (o) {
    h += '<div class="cmz-orbit' + (o.rev ? ' rev' : '') + '" style="--t:' + o.t + 's;--in:' + o.inset + '"><div class="cmz-ring"></div>';
    o.syms.forEach(function (s, i) {
      var a = o.off + i * 360 / o.syms.length;
      h += '<div class="cmz-sym" style="--a:' + a + 'deg;--r:' + o.r + ';--c:' + s[1] + ';--t:' + o.t + 's"><i>' + s[0] + '</i></div>';
    });
    h += '</div>';
  });
  h += '<div class="cmz-logo"><img alt="" draggable="false"></div>';
  CMZ_SPARKS.forEach(function (p) { h += '<span class="cmz-tw" style="top:' + p[0] + '%;left:' + p[1] + '%;animation-delay:' + p[2] + 's"></span>'; });
  h += '</div>';
  el.innerHTML = h;
  cmzLogoImg(el.querySelector('.cmz-logo'), logoUrl);
}

function cmzSetLogo(img, url) {
  if (!img) return;
  var fallback = './icons/creative-math-zone-logo.png';
  img.onerror = function () {
    if (img.dataset.cmzFallback) { img.style.display = 'none'; return; }
    img.dataset.cmzFallback = '1';
    img.src = fallback;
  };
  img.onload = function () { img.style.display = ''; };
  img.src = url || fallback;
}
function cmzLogoImg(box, url) {
  var img = box.querySelector('img');
  cmzSetLogo(img, url);
  if (img) img.onload = function () { box.classList.remove('noimg'); img.style.display = ''; };
}

/* Short welcome screen after a fresh sign-in. Tap to skip. */
function cmzSplash(name, logoUrl) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var d = document.createElement('div');
  d.id = 'cmz-splash';
  d.innerHTML = '<div><div class="cmz-logo"><img alt=""></div><p></p></div>';
  d.querySelector('p').textContent = 'Welcome' + (name ? ', ' + name : '');
  cmzLogoImg(d.querySelector('.cmz-logo'), logoUrl);
  d.addEventListener('click', function () { d.remove(); });
  document.body.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.remove(); }, 1900);
}

/* Counts the big numbers on a freshly drawn page up from zero. */
function cmzAnimate(root) {
  if (!root || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  root.querySelectorAll('.stat b').forEach(function (b) {
    if (b.children.length) return;
    var raw = b.textContent.trim();
    var m = /^(₹)?(-?[\d,]+(?:\.\d+)?)(%?)$/.exec(raw);
    if (!m) return;
    var target = parseFloat(m[2].replace(/,/g, ''));
    if (!isFinite(target) || target === 0 || target > 1e9) return;
    var dec = (m[2].split('.')[1] || '').length, grouped = !!m[1] || raw.indexOf(',') >= 0;
    var fmt = function (n) {
      var s = grouped ? n.toLocaleString('en-IN', { minimumFractionDigits: dec, maximumFractionDigits: dec }) : n.toFixed(dec);
      return (m[1] || '') + s + m[3];
    };
    var t0 = performance.now(), dur = 700;
    var step = function (now) {
      var k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      if (k < 1) { b.textContent = fmt(target * e); requestAnimationFrame(step); } else { b.textContent = raw; }
    };
    b.textContent = fmt(0);
    requestAnimationFrame(step);
  });
}

/* If the page config is slow or fails, still show the hero (with initials). */
document.addEventListener('DOMContentLoaded', function () {
  setTimeout(function () { var s = document.getElementById('hero-slot'); if (s && !s.firstChild) cmzHero(s, ''); }, 4000);
});
</script>

</head>
<body>

<!-- ============ SIGN IN ============ -->
<section id="login" class="hidden">
  <div class="sheet" aria-hidden="true">
    <div class="cmz-hero-slot" id="hero-slot"></div>
    <div class="tag"><span id="lg-tagline">Eat Math, Drink Math, Dream Math</span><small id="lg-centre">Creative Math Zone</small></div>
  </div>
  <div class="signin">
    <form id="login-form" autocomplete="on" novalidate>

      <h1>Admin sign in</h1>
      <p id="lg-sub">Use the username and password given to you.</p>
      <div id="lg-msg"></div>
      <label class="f"><span>Username</span><input name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
      <label class="f"><span>Password</span>
        <div class="pw"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="btn small" data-show="password">Show</button></div>
      </label>
      <button class="btn primary" style="width:100%" id="lg-btn">Sign in</button>
    </form>
  </div>
</section>

<!-- ============ CHANGE PASSWORD (first login) ============ -->
<section id="forcepw" class="hidden">
  <div class="signin" style="min-height:100vh">
    <form id="pw-form" style="max-width:400px;width:100%">
      <h1 style="font-size:1.8rem;margin-bottom:.4rem">Choose a new password</h1>
      <p class="muted" style="margin:0 0 1.25rem">You are using a temporary password. Set your own before continuing.</p>
      <div id="pw-msg"></div>
      <label class="f"><span>Temporary password</span><input name="oldPassword" type="password" autocomplete="current-password" required></label>
      <label class="f"><span>New password</span><input name="newPassword" type="password" autocomplete="new-password" required><small>At least 6 characters.</small></label>
      <label class="f"><span>Type the new password again</span><input name="again" type="password" autocomplete="new-password" required></label>
      <button class="btn primary" style="width:100%" id="pw-btn">Save and continue</button>
      <p style="text-align:center"><button type="button" class="link" id="pw-out">Sign out</button></p>
    </form>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <div class="topbar"><button id="menu-btn" aria-label="Open menu">Menu</button><b id="tb-centre">Creative Math Zone</b></div>
  <nav class="side" id="side" aria-label="Main">
            <div class="brand"><div class="logo-badge" id="nav-logo-badge"><img id="nav-logo" alt=""></div><span id="nav-centre">Creative Math Zone</span><small>Admin</small></div>
    <div id="nav-items"></div>
    <div class="live" id="live"><span class="dot"></span><span id="live-text">Live</span><button class="link" id="live-btn" type="button">Refresh</button></div>
    <div class="who"><b id="who-name"></b><span id="who-role" class="muted"></span><button class="btn small" id="logout">Sign out</button></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   Creative Math Zone — Admin portal
   The browser never touches the Sheet: every action goes through api().
   ===================================================================== */
const S = { token: null, user: null, cfg: {}, view: 'dashboard', L: {}, perms: [] };
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const can = p => S.perms.indexOf('*') >= 0 || S.perms.indexOf(p) >= 0;

const PERM_LABELS = {
  STUDENT_VIEW: 'View students', STUDENT_EDIT: 'Add and edit students', TEACHER_VIEW: 'View teachers', TEACHER_EDIT: 'Add and edit teachers',
  MASTER_VIEW: 'View subjects, batches, rooms', MASTER_EDIT: 'Edit subjects, batches, rooms', SETTINGS_VIEW: 'View settings', SETTINGS_EDIT: 'Change settings',
  USER_MANAGE: 'Manage users', LOG_VIEW: 'View activity log', FINANCE_VIEW: 'View finance', FINANCE_EDIT: 'Record payments and fees',
  TEACHER_INCOME_MANAGE: 'Manage teacher pay rates', TEACHER_INCOME_GRANT: 'Allow teachers to see their income', REPORT_VIEW: 'View reports',
  NOTICE_EDIT: 'Post notices', ATTENDANCE_CORRECT: 'Correct attendance'
};
const userExtraPermissions = value => (Array.isArray(value) ? value : String(value || '').split(','))
  .map(permission => String(permission).trim()).filter(Boolean);

/* ---------- server calls ---------- */
function api(action, payload) {
  const cfg = window.CMZ_CONFIG || {};
  if (!cfg.supabaseUrl || !cfg.supabasePublishableKey || cfg.supabasePublishableKey.includes('PASTE_YOUR_')) return Promise.reject({ code:'SETUP', error:'Open web/config.js and paste the Supabase publishable key from your project settings.' });
  const headers = { 'Content-Type':'application/json', apikey:cfg.supabasePublishableKey };
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  return fetch(cfg.supabaseUrl.replace(/\/$/, '') + '/functions/v1/api', {
    method:'POST', headers,
    body:JSON.stringify({ action, token:S.token, payload:payload || {} })
  }).then(async res => {
    const r = await res.json();
    if (r && r.data && r.data.v) { SYNC.v = r.data.v; SYNC.l = r.data.l; }
    if (!res.ok || !r || !r.ok) throw r || { code:'HTTP', error:'The server could not complete this request.' };
    return r.data;
  }).catch(e => { if (e && e.code) throw e; throw { code:'NETWORK', error:'Could not reach Supabase. Check your internet and project settings.' }; });
}
const SESSION_CODES = ['SESSION_EXPIRED', 'SESSION_REVOKED', 'AUTH_REQUIRED'];
function fail(e) {
  if (e && SESSION_CODES.indexOf(e.code) >= 0) { signedOut(e.error); return; }
  if (e && e.code === 'PASSWORD_CHANGE_REQUIRED') { show('forcepw'); return; }
  toast((e && e.error) || 'Something went wrong.', true);
}
function viewFail(main, view, arg, error) {
  if (error && (SESSION_CODES.indexOf(error.code) >= 0 || error.code === 'PASSWORD_CHANGE_REQUIRED')) { fail(error); return; }
  console.error('Portal page failed to load:', view, error);
  const message = String((error && (error.error || error.message)) || 'The page could not load. Refresh and try again.').slice(0, 500);
  main.innerHTML = '<section class="card" role="alert"><h1>Could not load this page</h1><p>' + esc(message) + '</p><button class="btn primary" type="button" id="view-retry">Retry</button></section>';
  $('#view-retry', main).addEventListener('click', () => go(view, arg));
}
async function busy(btn, fn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { fail(e); return undefined; } finally { if (btn) btn.disabled = false; }
}

/* ---------- small UI helpers ---------- */
function toast(msg, bad) {
  const d = document.createElement('div'); if (bad) d.className = 'bad'; d.textContent = msg;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), bad ? 6500 : 3500);
}
function show(which) {
  ['login', 'forcepw', 'app'].forEach(id => $('#' + id).classList.toggle('hidden', id !== which));
  if (which === 'login') $('#login-form').elements.username.focus();
}
function fmtDate(s) { return /^\d{4}-\d{2}-\d{2}/.test(s || '') ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : (s || ''); }
function fmtTime(s) { return /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s || '') ? fmtDate(s) + ' ' + s.slice(11, 16) : fmtDate(s); }
function fmtHM(hhmm) {
  if (!/^\d{2}:\d{2}/.test(hhmm || '')) return hhmm || '';
  const h = +hhmm.slice(0, 2), m = hhmm.slice(3, 5);
  return ((h % 12) || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
}
function pill(status) {
  const k = String(status).toUpperCase();
  const cls = ['ACTIVE', 'COMPLETED'].indexOf(k) >= 0 ? 'ok' : (['INACTIVE', 'LEFT', 'SUSPENDED', 'ENDED', 'FAIL'].indexOf(k) >= 0 ? 'bad' : '');
  return '<span class="pill ' + cls + '">' + esc(status || '—') + '</span>';
}
function openDlg(title, body, footer, onMount) {
  const d = $('#dlg');
  d.innerHTML = '<div class="dlg-h"><h2>' + esc(title) + '</h2><button class="btn small" type="button" data-close>Close</button></div>' +
    '<div class="dlg-b">' + body + '</div>' + (footer ? '<div class="dlg-f">' + footer + '</div>' : '');
  if (!d.open) d.showModal();
  if (onMount) onMount(d);
  return d;
}
function closeDlg() { const d = $('#dlg'); if (d.open) d.close(); }
function credentials(title, username, pw, note) {
  openDlg(title,
    '<p>' + esc(note || 'Give these to the user. The password is shown only once and cannot be looked up later.') + '</p>' +
    '<div class="cred"><div><span class="muted">Username</span><code id="c-u">' + esc(username) + '</code></div>' +
    '<div><span class="muted">Temporary password</span><code id="c-p">' + esc(pw) + '</code></div></div>' +
    '<p class="muted">They will be asked to choose their own password at first sign-in.</p>',
    '<button class="btn" type="button" id="c-copy">Copy both</button><button class="btn primary" type="button" data-close>Done</button>',
    d => $('#c-copy', d).addEventListener('click', () => {
      const t = 'Username: ' + username + '\nPassword: ' + pw;
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Copied.'), () => toast('Copy did not work. Select the text and copy it by hand.', true));
    }));
}

/* ---------- generic form builder ---------- */
function fieldHtml(f, val) {
  const v = val == null ? '' : val, req = f.req ? ' <em>*</em>' : '';
  let inner;
    if (f.type === 'select') {
    const opts = typeof f.options === 'function' ? f.options() : (f.options || []);
    inner = '<select name="' + f.n + '"' + (f.req ? ' required' : '') + '>' + (f.req && v ? '' : '<option value="">' + esc(f.blank || 'Select…') + '</option>') +
      opts.map(o => '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join('') + '</select>';
  } else if (f.type === 'check') {
    return '<label class="f ' + (f.full ? 'full' : '') + '"><span><input type="checkbox" name="' + f.n + '" style="width:auto;min-height:0;margin-right:.5rem"' + (String(v).toUpperCase() === 'TRUE' ? ' checked' : '') + '>' + esc(f.l) + '</span>' + (f.hint ? '<small>' + esc(f.hint) + '</small>' : '') + '</label>';
  } else {
    inner = '<input name="' + f.n + '" type="' + (f.type || 'text') + '" value="' + esc(v) + '"' + (f.req ? ' required' : '') + (f.ro ? ' readonly' : '') + (f.step ? ' step="' + f.step + '"' : '') + (f.max ? ' maxlength="' + f.max + '"' : '') + ' autocomplete="off">';
  }
  return '<label class="f ' + (f.full ? 'full' : '') + '"><span>' + esc(f.l) + req + '</span>' + inner + (f.hint ? '<small>' + esc(f.hint) + '</small>' : '') + '</label>';
}
function formHtml(fields, vals) { vals = vals || {}; return '<div class="grid2">' + fields.map(f => fieldHtml(f, vals[f.n])).join('') + '</div>'; }
function collect(root, fields) {
  const o = {};
  fields.forEach(f => {
    const el = root.querySelector('[name="' + f.n + '"]'); if (!el) return;
    o[f.n] = f.type === 'check' ? (el.checked ? 'TRUE' : 'FALSE') : el.value.trim();
  });
  return o;
}
function changedOnly(now, orig) { const o = {}; Object.keys(now).forEach(k => { if (String(now[k]) !== String(orig[k] == null ? '' : orig[k])) o[k] = now[k]; }); return o; }
function validForm(root) {
  const bad = $$('[required]', root).find(el => !String(el.value).trim());
  if (bad) { bad.focus(); toast('Please fill in: ' + (bad.closest('label').querySelector('span').textContent.replace('*', '').trim()), true); return false; }
  return true;
}

/* ---------- lookups ---------- */
async function loadLookups() {
  const jobs = [];
  if (can('MASTER_VIEW')) jobs.push(api('subjects.list').then(r => S.L.subjects = r), api('batches.list').then(r => S.L.batches = r), api('rooms.list').then(r => S.L.rooms = r));
  if (can('TEACHER_VIEW')) jobs.push(api('teachers.list').then(r => S.L.teachers = r));
  await Promise.all(jobs);
}
const L = k => S.L[k] || [];
const nameOf = (list, idf, namef, id) => { const r = L(list).find(x => x[idf] === id); return r ? r[namef] : id; };
const activeOnly = list => L(list).filter(x => String(x.Status).toUpperCase() === 'ACTIVE');

/* ---------- sign in / out ---------- */
function signedOut(msg) {
  if (S.token) { try { sessionStorage.removeItem('cmz_t'); } catch (e) {} }
  stopLive(); S.token = null; S.user = null; S.perms = []; S.L = {};
  closeDlg(); show('login');
  $('#lg-msg').innerHTML = msg ? '<div class="alert warn">' + esc(msg) + '</div>' : '';
}
function startApp() {
  $('#who-name').textContent = S.user.displayName;
  $('#who-role').textContent = S.user.role === 'SUPER_ADMIN' ? 'Super Admin' : 'Accounts Admin';
  buildNav(); show('app'); go(new URLSearchParams(location.search).has('drive_code')?'settings':'dashboard'); refreshRegBadge(); startLive();
}
function afterAuth(user, token) {
  S.token = token; S.user = user; S.perms = user.permissions || [];
  try { sessionStorage.setItem('cmz_t', token); } catch (e) {}
  if (user.mustChangePassword) { show('forcepw'); $('#pw-form').reset(); $('#pw-msg').innerHTML = ''; $('#pw-form').elements.oldPassword.focus(); return; }
  startApp();
}
$('#login-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target, btn = $('#lg-btn');
  if (!f.elements.username.value.trim() || !f.elements.password.value) { $('#lg-msg').innerHTML = '<div class="alert bad">Enter your username and password.</div>'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…'; $('#lg-msg').innerHTML = '';
  try {
    const r = await api('auth.login', { username: f.elements.username.value, password: f.elements.password.value, portal: 'ADMIN' });
    f.elements.password.value = '';
    if (window.cmzSplash && !r.user.mustChangePassword) cmzSplash(r.user.displayName, S.cfg.logoUrl); afterAuth(r.user, r.token);
  } catch (e) { $('#lg-msg').innerHTML = '<div class="alert bad">' + esc(e.error || 'Could not sign in.') + '</div>'; }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});
document.addEventListener('click', ev => {
  const sh = ev.target.closest('[data-show]');
  if (sh) { const i = sh.parentElement.querySelector('input'); i.type = i.type === 'password' ? 'text' : 'password'; sh.textContent = i.type === 'password' ? 'Show' : 'Hide'; }
  if (ev.target.closest('[data-close]')) closeDlg();
});
$('#pw-form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target.elements, btn = $('#pw-btn');
  if (f.newPassword.value !== f.again.value) { $('#pw-msg').innerHTML = '<div class="alert bad">The two new passwords do not match.</div>'; return; }
  btn.disabled = true; $('#pw-msg').innerHTML = '';
  try {
    const r = await api('auth.changePassword', { oldPassword: f.oldPassword.value, newPassword: f.newPassword.value });
    S.token = r.token; try { sessionStorage.setItem('cmz_t', r.token); } catch (e) {}
    S.user.mustChangePassword = false; startApp(); toast('Password changed.');
  } catch (e) {
    if (SESSION_CODES.indexOf(e.code) >= 0) signedOut(e.error); else $('#pw-msg').innerHTML = '<div class="alert bad">' + esc(e.error) + '</div>';
  } finally { btn.disabled = false; }
});
async function doLogout() { try { await api('auth.logout'); } catch (e) {} signedOut('You have signed out.'); }
$('#logout').addEventListener('click', doLogout);
$('#pw-out').addEventListener('click', doLogout);

/* ---------- navigation ---------- */
const NAV = [
  ['dashboard', 'Dashboard', null],
  ['students', 'Students', 'STUDENT_VIEW'],
  ['registrations', 'Registrations', 'STUDENT_VIEW'],
  ['teachers', 'Teachers', 'TEACHER_VIEW'],
  ['academic', 'Subjects, batches, rooms', 'MASTER_VIEW'],
  ['timetable', 'Timetable', 'MASTER_VIEW'],
  ['attendance', 'Attendance', 'STUDENT_VIEW'],
  ['notices', 'Notices', 'NOTICE_VIEW'],
  ['fees', 'Fee structure', 'FINANCE_VIEW'],
  ['invoices', 'Invoices', 'FINANCE_VIEW'],
  ['receipts', 'Receipts', 'FINANCE_VIEW'],
  ['teacherincome', 'Teacher income', 'TEACHER_INCOME_MANAGE'],
  ['reports', 'Reports', 'REPORT_VIEW'],
  ['settings', 'Settings', 'SETTINGS_VIEW'],
  ['users', 'Admin users', 'USER_MANAGE'],
  ['logs', 'Activity log', 'LOG_VIEW']
];
function buildNav() {
  $('#nav-items').innerHTML = NAV.filter(n => !n[2] || can(n[2])).map(n => '<button class="item" data-go="' + n[0] + '">' + esc(n[1]) + '</button>').join('');
}
function go(view, arg){ S.view=view; S.arg=arg; SYNC.stale=false; liveState('Live'); $('#side').classList.remove('open');
  $$('#nav-items .item').forEach(b => b.setAttribute('aria-current', b.dataset.go===view ? 'page' : 'false'));
  const main=$('#main'); main.classList.remove('quiet'); main.innerHTML='<div class="cmz-loader"><i></i></div>';
  Promise.resolve().then(() => (VIEWS[view] || VIEWS.dashboard)(main, arg)).then(() => { if (window.cmzAnimate) cmzAnimate(main); }).catch(e => viewFail(main, view, arg, e)); window.scrollTo(0,0);
}
$('#nav-items').addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b) go(b.dataset.go); });
$('#menu-btn').addEventListener('click', () => $('#side').classList.toggle('open'));

const VIEWS = {};

/* ---------- dashboard ---------- */
VIEWS.dashboard = async main => {
  await loadLookups();
  let students = [], total = 0;
  if (can('STUDENT_VIEW')) { const r = await api('students.list', { limit: 1000 }); students = r.students; total = r.total; }
  const active = students.filter(s => s.Status === 'ACTIVE').length;
  const perBatch = L('batches').map(b => ({ b: b, n: students.filter(s => s.CurrentBatch === b.BatchID && s.Status === 'ACTIVE').length }));
  const max = Math.max(1, ...perBatch.map(x => x.n));
  const needsSetup = can('STUDENT_VIEW') && !L('teachers').length && !students.length;
  main.innerHTML = '<div class="head"><div><h1>Welcome, ' + esc(S.user.displayName) + '</h1><p>' + esc(S.cfg.centreName || '') + ' · Academic year ' + esc(S.cfg.academicYear || '') + '</p></div>' +
    '<div class="row">' + (can('STUDENT_EDIT') ? '<button class="btn primary" data-act="add-student">Add student</button>' : '') + (can('TEACHER_EDIT') ? '<button class="btn" data-act="add-teacher">Add teacher</button>' : '') + '</div></div>' +
    '<div class="stats">' +
      (can('STUDENT_VIEW') ? '<div class="card stat"><b>' + active + '</b><span>Active students</span></div><div class="card stat"><b>' + total + '</b><span>Students in total</span></div>' : '') +

const classOpts = () => Array.from(new Set(activeOnly('batches').map(b => b.Class))).map(c => [c, 'Class ' + c]);
const batchOpts = cls => activeOnly('batches').filter(b => !cls || b.Class === cls).map(b => [b.BatchID, b.BatchName]);
function studentFields(isEdit) {
  const f = [
    { n: 'Name', l: 'Full name', req: 1, full: 1, max: 100 },
    { n: 'CurrentClass', l: 'Class', type: 'select', req: 1, options: classOpts() },
    { n: 'CurrentBatch', l: 'Batch', type: 'select', options: batchOpts(), blank: 'No batch yet' },
    { n: 'DOB', l: 'Date of birth', type: 'date' }, { n: 'Gender', l: 'Gender', type: 'select', options: [['MALE', 'Male'], ['FEMALE', 'Female'], ['OTHER', 'Other']] },
    { n: 'Mobile', l: 'Student mobile', type: 'tel', hint: '10 digits' }, { n: 'Email', l: 'Student email', type: 'email' },
    { n: 'School', l: 'School' }, { n: 'Board', l: 'Board', hint: 'CBSE, ICSE, WBBSE…' },
    { n: 'PreviousPercentage', l: 'Previous exam %', type: 'number', step: 'any' }, { n: 'Address', l: 'Address', full: 1 },
    { n: 'ParentName', l: 'Parent or guardian' }, { n: 'Relationship', l: 'Relationship' },
    { n: 'ParentMobile', l: 'Parent mobile', type: 'tel' }, { n: 'ParentWhatsApp', l: 'Parent WhatsApp', type: 'tel' }, { n: 'ParentEmail', l: 'Parent email', type: 'email', full: 1 }
  ];
  if (isEdit) f.splice(3, 0, { n: 'Status', l: 'Status', type: 'select', req: 1, options: ['ACTIVE', 'INACTIVE', 'COMPLETED', 'LEFT', 'SUSPENDED'].map(x => [x, x.charAt(0) + x.slice(1).toLowerCase()]) });

}
function wireClassBatch(root, current) {
  const cls = root.querySelector('[name=CurrentClass]'), bat = root.querySelector('[name=CurrentBatch]');
  if (!cls || !bat) return;
  const fill = keep => { bat.innerHTML = '<option value="">No batch yet</option>' + batchOpts(cls.value).map(o => '<option value="' + esc(o[0]) + '"' + (o[0] === keep ? ' selected' : '') + '>' + esc(o[1]) + '</option>').join(''); };
  cls.addEventListener('change', () => fill(''));
  fill(current);
}
async function studentDialog() {

}

  }
  const fmt = n => '₹' + (Number(n) || 0).toLocaleString('en-IN');
  return '<div class="card">' +
    '<h2 style="font-size:1.15rem;margin-bottom:.4rem">Monthly fees</h2>' +
    '<p class="muted" style="font-size:.85rem;margin:0 0 .75rem">Standard fee per subject from the fee structure. Apply a discount if this student has a special arrangement.</p>' +
    '<div class="tablewrap"><table class="stack"><thead><tr>' +
      '<th>Subject</th><th>Teacher</th><th>Standard</th><th>Discount</th><th>Final</th><th></th>' +
    '</tr></thead><tbody>' +
    fees.lines.map(l =>
      '<tr data-sid="' + esc(l.SubjectID) + '">' +
      '<td data-l="Subject"><b>' + esc(l.SubjectName) + '</b>' + (l.Reason ? '<div class="muted" style="font-size:.82rem">' + esc(l.Reason) + '</div>' : '') + '</td>' +
      '<td data-l="Teacher">' + esc(l.TeacherName) + '</td>' +
      '<td data-l="Standard">' + fmt(l.StandardAmount) + '</td>' +
      '<td data-l="Discount">' + (l.DiscountAmount ? '<span class="pill warn">−' + fmt(l.DiscountAmount) + '</span>' : '—') + '</td>' +
      '<td data-l="Final"><b>' + fmt(l.FinalAmount) + '</b></td>' +
      '<td>' +
        '<button class="btn small" data-set-disc="' + esc(l.SubjectID) + '">' + (l.HasOverride ? 'Edit' : 'Set discount') + '</button>' +
        (l.HasOverride ? ' <button class="btn small danger" data-rm-disc="' + esc(l.SubjectID) + '">Remove</button>' : '') +
      '</td>' +
      '</tr>').join('') +
    '</tbody></table></div>' +
    '<div style="margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line)">' +
      '<div style="display:flex;justify-content:space-between;font-size:1.05rem"><span class="muted">Monthly total</span><b>' + fmt(fees.monthlyTotal) + '</b></div>' +
      '<div style="display:flex;justify-content:space-between;margin-top:.3rem"><span class="muted">Registration (one-time)</span><b>' + fmt(fees.registration) + '</b></div>' +
    '</div>' +
  '</div>';
}

function wireFeeDiscounts(main, fees, studentId) {
  $$('[data-set-disc]', main).forEach(btn => btn.addEventListener('click', () => {
    const subjectId = btn.dataset.setDisc;
    const line = fees.lines.find(x => x.SubjectID === subjectId);
    if (!line) return;
    openDlg('Discount for ' + line.SubjectName,
      '<form><div class="grid2">' +
        '<label class="f"><span>Standard fee</span><input value="₹' + line.StandardAmount + '" readonly></label>' +
        '<label class="f"><span>Discount (₹)</span><input name="discount" type="number" step="any" min="0" max="' + line.StandardAmount + '" value="' + line.DiscountAmount + '" required></label>' +
        '<label class="f full"><span>Reason</span><input name="reason" maxlength="200" value="' + esc(line.Reason) + '" placeholder="e.g. sibling concession"></label>' +
      '</div></form>',
      '<button class="btn" type="button" data-close>Cancel</button>' +
      '<button class="btn primary" id="disc-save">Save</button>',
      d => $('#disc-save', d).addEventListener('click', ev => busy(ev.target, async () => {
        const disc = d.querySelector('[name=discount]').value;
        const reason = d.querySelector('[name=reason]').value;
        if (disc === '' || Number(disc) < 0) { toast('Enter a discount amount.', true); return; }
        if (Number(disc) > line.StandardAmount) { toast('Discount cannot exceed the standard fee.', true); return; }
        try {
          await api('finance.studentFee.set', { studentId: studentId, subjectId: subjectId, discountAmount: disc, reason: reason });
          closeDlg();
          toast('Discount saved.');
          go('student', studentId);
          setTimeout(() => { const t = $('[data-tab=f]'); if (t) t.click(); }, 50);
        } catch (e) { fail(e); }
      })));
  }));

  $$('[data-rm-disc]', main).forEach(btn => btn.addEventListener('click', () => {
    const subjectId = btn.dataset.rmDisc;
    if (!confirm('Remove the discount on this subject? The student will be charged the standard fee from today.')) return;
    busy(btn, async () => {
      await api('finance.studentFee.remove', { studentId: studentId, subjectId: subjectId });
      toast('Discount removed.');
      go('student', studentId);
      setTimeout(() => { const t = $('[data-tab=f]'); if (t) t.click(); }, 50);
    });
  }));
}

async function refreshRegBadge() {

/* ---------- teachers ---------- */
function teacherFields(isNew) {
  const f = [{ n: 'Name', l: 'Full name', req: 1, full: 1 }];
  if (isNew) f.push({ n: 'Username', l: 'Login username', req: 1, hint: 'Letters and numbers, 3–30 characters. Cannot be changed later.' });
  f.push({ n: 'Mobile', l: 'Mobile', type: 'tel' }, { n: 'Email', l: 'Email', type: 'email' }, { n: 'Qualification', l: 'Qualification' }, { n: 'JoiningDate', l: 'Joining date', type: 'date' }, { n: 'Address', l: 'Address', full: 1 });
  if (!isNew) f.push({ n: 'Status', l: 'Status', type: 'select', req: 1, options: [['Active', 'Active'], ['Inactive', 'Inactive']] });
  if (can('TEACHER_INCOME_MANAGE')) f.push({ n: 'DefaultRatePerStudent', l: 'Pay per student per month (₹)', type: 'number', step: 'any' });
  if (can('TEACHER_INCOME_GRANT')) f.push({ n: 'IncomeVisibleToTeacher', l: 'Teacher can see their own income', type: 'check', full: 1, hint: 'Off by default. The teacher is signed out so the change applies right away.' });
  return f;
}
function teacherDialog(t) {
  const isNew = !t, fields = teacherFields(isNew);
  openDlg(isNew ? 'Add teacher' : 'Edit teacher', '<form>' + formHtml(fields, t || {}) + (isNew ? '<label class="f"><span>Password (optional)</span><input name="password" autocomplete="off"><small>Leave empty and the system makes a temporary one.</small></label>' : '') + '</form>',
    '<button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="tf-save">' + (isNew ? 'Add teacher' : 'Save changes') + '</button>',
    d => $('#tf-save', d).addEventListener('click', ev => busy(ev.target, async () => {
      if (!validForm(d)) return;
      const data = collect(d, fields);
      if (isNew) {
        const teacher = {}; Object.keys(data).forEach(k => { if (data[k] !== '') teacher[k] = data[k]; });
        const r = await api('teachers.add', { teacher: teacher, password: $('[name=password]', d).value.trim() || undefined });
        closeDlg(); toast('Teacher added: ' + r.teacherId); credentials('Teacher login', r.username, r.tempPassword);
      } else {
        const ch = changedOnly(data, t);
        if (!Object.keys(ch).length) { toast('Nothing has changed.'); return; }
        await api('teachers.update', { teacherId: t.TeacherID, changes: ch }); closeDlg(); toast('Saved.');

      await loadLookups(); if (S.view === 'teachers') go('teachers'); else if (S.view === 'dashboard') go('dashboard');
    })));
}

const TT_DAYS_UI = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
function dayLabel_(d) { return d.charAt(0) + d.slice(1).toLowerCase(); }

function ttFields(isEdit) {
  const f = [
    { n: 'Day', l: 'Day', type: 'select', req: 1, options: TT_DAYS_UI.map(d => [d, dayLabel_(d)]) },
    { n: 'StartTime', l: 'Start time', type: 'time', req: 1 },
    { n: 'EndTime',   l: 'End time',   type: 'time', req: 1 },
    { n: 'BatchID',   l: 'Batch',   type: 'select', req: 1, options: () => activeOnly('batches').map(b => [b.BatchID, b.BatchName + ' (' + b.Class + ')']) },
    { n: 'SubjectID', l: 'Subject', type: 'select', req: 1, options: () => activeOnly('subjects').map(s => [s.SubjectID, s.SubjectName]) },
    { n: 'CoSubjectID', l: 'Also teaching (optional)', type: 'select', req: 0, blank: 'No combined subject', options: () => activeOnly('subjects').map(s => [s.SubjectID, s.SubjectName]), hint: 'Only Computer Science + Computer Application or Math + WBJEE Math (Math_) can be combined.' },
    { n: 'TeacherID', l: 'Teacher', type: 'select', req: 1, options: () => activeOnly('teachers').map(t => [t.TeacherID, t.Name]) },
    { n: 'RoomID',    l: 'Room',    type: 'select', req: 1, options: () => activeOnly('rooms').map(r => [r.RoomID, r.RoomName]) }
  ];
  if (isEdit) f.push({ n: 'Status', l: 'Status', type: 'select', req: 1, options: [['Active','Active'],['Inactive','Inactive']] });

}

/* ---------- payment recording ---------- */
function paymentDialog(invoice, lines, onDone) {
  const today = new Date().toISOString().slice(0, 10);
  const fmt = n => '₹' + (Number(n) || 0).toLocaleString('en-IN');
  const open = (lines || []).filter(l => l.balanceAmount > 0);
  const lump = !open.length; // only if an invoice has no subject lines
  const numStyle = 'width:120px;height:40px;margin:0;padding:.4rem .6rem;border:1px solid #c5d1e0;border-radius:8px';
  const rows = open.map(l =>
    '<div class="perm" data-sub="' + esc(l.subjectId) + '" data-bal="' + l.balanceAmount + '" style="align-items:center">' +
      '<input type="checkbox" checked aria-label="Pay ' + esc(l.subjectName) + '">' +
      '<span style="flex:1"><b>' + esc(l.subjectName) + '</b><div class="muted" style="font-size:.82rem">Fee ' + fmt(l.finalAmount) + ' · paid ' + fmt(l.paidAmount) + ' · balance ' + fmt(l.balanceAmount) + '</div></span>' +
      '<input type="number" step="any" min="0" max="' + l.balanceAmount + '" value="' + l.balanceAmount + '" style="' + numStyle + '" aria-label="Amount for ' + esc(l.subjectName) + '">' +
    '</div>').join('');

  openDlg('Record payment',
    '<p class="muted" style="margin:0 0 .75rem">' + esc(invoice.MonthLabel) + ' · ' + esc(invoice.StudentName) +
      ' · Balance <b>' + fmt(invoice.BalanceAmount) + '</b></p>' +
    '<form>' +
      (lump
        ? '<label class="f"><span>Amount received <em style="color:var(--bad);font-style:normal">*</em></span>' +
            '<input name="amount" type="number" step="any" min="1" max="' + invoice.BalanceAmount + '" value="' + invoice.BalanceAmount + '" required></label>'
        : '<div style="margin-bottom:.3rem"><b>Which subjects is this payment for?</b>' +
            '<div class="muted" style="font-size:.85rem">Untick a subject that is not being paid today, or lower its amount for a part payment.</div></div>' +
          rows +
          '<div style="display:flex;justify-content:space-between;margin:.7rem 0 1rem;font-size:1.05rem"><span class="muted">Total received</span><b id="pay-total">₹0</b></div>') +
      '<div class="grid2">' +
        '<label class="f"><span>Payment date</span><input name="paymentDate" type="date" value="' + today + '"></label>' +
        '<label class="f"><span>Mode <em style="color:var(--bad);font-style:normal">*</em></span>' +
          '<select name="mode" required>' +
            '<option value="CASH">Cash</option><option value="UPI">UPI</option>' +
            '<option value="BANK_TRANSFER">Bank transfer</option><option value="CHEQUE">Cheque</option>' +
          '</select></label>' +
        '<label class="f full" data-refwrap><span>Reference / transaction ID</span>' +
          '<input name="reference" maxlength="100" placeholder="Required for non-cash payments" autocomplete="off"></label>' +
      '</div>' +
      '<label class="f"><span>Notes</span><input name="notes" maxlength="500" autocomplete="off"></label>' +
    '</form>',
    '<button class="btn" type="button" data-close>Cancel</button>' +
    '<button class="btn primary" id="pay-save">Save payment</button>',
    d => {
      const mode = d.querySelector('[name=mode]');
      const refWrap = d.querySelector('[data-refwrap]');
      const sync = () => { refWrap.style.display = (mode.value === 'CASH') ? 'none' : ''; };
      mode.addEventListener('change', sync); sync();

      const rowEls = $$('[data-sub]', d);
      const total = () => rowEls.reduce((s, r) => s + ($('input[type=checkbox]', r).checked ? (Number($('input[type=number]', r).value) || 0) : 0), 0);
      const showTotal = () => { const t = $('#pay-total', d); if (t) t.textContent = fmt(Math.round(total() * 100) / 100); };
      rowEls.forEach(r => {
        const cb = $('input[type=checkbox]', r), am = $('input[type=number]', r);
        cb.addEventListener('change', () => {
          am.disabled = !cb.checked;
          if (cb.checked && !(Number(am.value) > 0)) am.value = r.dataset.bal;
          showTotal();
        });
        am.addEventListener('input', showTotal);
      });
      showTotal();

      $('#pay-save', d).addEventListener('click', ev => busy(ev.target, async () => {
        const md = mode.value;
        const ref = d.querySelector('[name=reference]').value.trim();
        const payload = {
          invoiceId: invoice.InvoiceID, mode: md, reference: ref,
          paymentDate: d.querySelector('[name=paymentDate]').value, notes: d.querySelector('[name=notes]').value.trim()
        };
        if (md !== 'CASH' && !ref) { toast('Please enter the transaction reference.', true); return; }
        if (lump) {
          const amt = Number(d.querySelector('[name=amount]').value);
          if (!amt || amt <= 0) { toast('Enter an amount.', true); return; }
          if (amt > invoice.BalanceAmount) { toast('Amount exceeds the balance.', true); return; }
          payload.amount = amt;
        } else {
          const allocations = [];
          for (const r of rowEls) {
            if (!$('input[type=checkbox]', r).checked) continue;
            const a = Number($('input[type=number]', r).value);
            if (!(a > 0)) continue;
            if (a > Number(r.dataset.bal) + 0.005) { toast($('b', r).textContent + ': amount is more than its balance.', true); return; }
            allocations.push({ subjectId: r.dataset.sub, amount: a });
          }
          if (!allocations.length) { toast('Enter an amount for at least one subject.', true); return; }
          payload.allocations = allocations;
        }
        const r = await api('payments.record', payload);
        closeDlg();
        toast('Payment recorded · Receipt ' + r.receiptId);
        if (onDone) onDone(r);
      }));
    });
}

function invoiceStatusPill(s) {
  const k = String(s || '').toUpperCase();
  const cls = k === 'PAID' ? 'ok' : (k === 'OVERDUE' || k === 'CANCELLED' ? 'bad' : (k === 'PARTIAL' ? 'warn' : ''));
  return '<span class="pill ' + cls + '">' + esc(k || '—') + '</span>';
}

/* ---------- teacher income ---------- */
function tiPill(s) {
  const k = String(s || '').toUpperCase();
  const c = k === 'PAID' ? 'ok' : (k === 'PARTIAL' ? 'warn' : '');
  return '<span class="pill ' + c + '">' + esc(k || '—') + '</span>';
}

VIEWS.teacherincome = async main => {
  await loadLookups();
  const st = VIEWS.teacherincome.state = VIEWS.teacherincome.state || { month: '', teacherId: '' };

  if (!st.month) st.month = cur;
  const fmt = n => '₹' + (Number(n) || 0).toLocaleString('en-IN');

  main.innerHTML =
    '<div class="head"><div><h1>Teacher income</h1><p>Monthly pay worked out from active students per teacher and subject.</p></div>' +
      '<button class="btn primary" id="ti-gen">Generate month</button></div>' +
    '<div class="toolbar">' +
      '<input id="ti-month" type="month" value="' + esc(st.month) + '" style="max-width:180px">' +
      '<select id="ti-teacher"><option value="">All teachers</option>' +

      '<div class="card stat"><b>' + t.count + '</b><span>Records</span></div>' +
      '<div class="card stat"><b>' + fmt(t.payable) + '</b><span>Payable</span></div>' +
      '<div class="card stat"><b>' + fmt(t.paid) + '</b><span>Paid</span></div>' +
      '<div class="card stat"><b>' + fmt(t.balance) + '</b><span>Still to pay</span></div>';
    $('#ti-list').innerHTML = r.rows.length
      ? '<div class="tablewrap"><table class="stack"><thead><tr><th>Teacher</th><th>Subject</th><th>Students</th><th>Rate</th><th>Adjust</th><th>Payable</th><th>Paid</th><th>Balance</th><th>Status</th></tr></thead><tbody>' +
        r.rows.map(x =>
          '<tr class="click" data-ti="' + esc(x.IncomeID) + '">' +
          '<td data-l="Teacher"><b>' + esc(x.TeacherName) + '</b></td>' +
          '<td data-l="Subject">' + esc(x.SubjectName) + '</td>' +
          '<td data-l="Students">' + x.StudentCount + '</td>' +
          '<td data-l="Rate">' + fmt(x.RatePerStudent) + '</td>' +
          '<td data-l="Adjust">' + (x.Adjustment ? (x.Adjustment > 0 ? '+' : '−') + fmt(Math.abs(x.Adjustment)) : '—') + '</td>' +
          '<td data-l="Payable"><b>' + fmt(x.FinalPayable) + '</b></td>' +
          '<td data-l="Paid">' + fmt(x.PaidAmount) + '</td>' +
          '<td data-l="Balance">' + fmt(x.BalanceAmount) + '</td>' +
          '<td>' + tiPill(x.Status) + '</td></tr>').join('') + '</tbody></table></div>'
      : '<div class="card empty"><b>No income records for this month</b>Click “Generate month” to work them out.</div>';
    $$('[data-ti]', main).forEach(tr => tr.addEventListener('click', () => detail(tr.dataset.ti)));
  };

  const detail = async id => {
    const d = await api('teacherIncome.get', { incomeId: id });
    const i = d.income;
    openDlg(i.TeacherName + ' · ' + i.SubjectName + ' · ' + i.MonthLabel,
      '<dl class="kv">' +
        '<dt>Students</dt><dd>' + i.StudentCount + ' × ' + fmt(i.RatePerStudent) + ' = ' + fmt(i.GrossIncome) + '</dd>' +
        '<dt>Adjustment</dt><dd>' + (i.Adjustment ? fmt(i.Adjustment) + ' · ' + esc(i.AdjustmentReason) : '—') + '</dd>' +
        '<dt>Payable</dt><dd><b>' + fmt(i.FinalPayable) + '</b></dd>' +
        '<dt>Paid</dt><dd>' + fmt(i.PaidAmount) + '</dd>' +
        '<dt>Balance</dt><dd><b>' + fmt(i.BalanceAmount) + '</b> ' + tiPill(i.Status) + '</dd></dl>' +
      '<div class="section"><h2>Payments</h2>' +
      (d.payments.length
        ? '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Amount</th><th>Mode</th><th>By</th></tr></thead><tbody>' +
          d.payments.map(p => '<tr><td>' + esc(fmtDate(p.PaymentDate)) + '</td><td>' + fmt(p.Amount) + '</td><td>' + esc(p.PaymentMode) +
            (p.UPIReference ? ' · <span class="muted">' + esc(p.UPIReference) + '</span>' : '') + '</td><td>' + esc(p.PaidBy) + '</td></tr>').join('') +
          '</tbody></table></div>'
        : '<p class="muted">No payments yet.</p>') + '</div>',
      '<button class="btn" type="button" data-close>Close</button>' +
      '<button class="btn" id="ti-adj">Adjust</button>' +
      (i.BalanceAmount > 0 ? '<button class="btn primary" id="ti-pay">Pay teacher</button>' : ''),
      dlg => {
        $('#ti-adj', dlg).addEventListener('click', () => adjustDlg(i));
        const pay = $('#ti-pay', dlg); if (pay) pay.addEventListener('click', () => payDlg(i));
      });
  };

  const adjustDlg = i => {
    openDlg('Adjust ' + i.TeacherName + ' · ' + i.MonthLabel,
      '<p class="muted" style="margin:0 0 .75rem">Gross is ' + fmt(i.GrossIncome) + '. Use a positive number for a bonus and a negative number for a deduction.</p>' +
      '<form><label class="f"><span>Adjustment (₹) <em>*</em></span><input name="adj" type="number" step="any" value="' + i.Adjustment + '" required></label>' +
      '<label class="f"><span>Reason <em>*</em></span><input name="reason" maxlength="200" value="' + esc(i.AdjustmentReason) + '" required></label></form>',
      '<button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="adj-save">Save</button>',

        if (!validForm(dlg)) return;
        await api('teacherIncome.adjust', { incomeId: i.IncomeID, adjustment: $('[name=adj]', dlg).value, reason: $('[name=reason]', dlg).value.trim() });
        closeDlg(); toast('Adjustment saved.'); await load();
      })));
  };

  const payDlg = i => {
    const today = new Date().toISOString().slice(0, 10);
    openDlg('Pay ' + i.TeacherName,
      '<p class="muted" style="margin:0 0 .75rem">' + esc(i.SubjectName) + ' · ' + esc(i.MonthLabel) + ' · Balance <b>' + fmt(i.BalanceAmount) + '</b></p>' +
      '<form><div class="grid2">' +
        '<label class="f"><span>Amount <em>*</em></span><input name="amount" type="number" step="any" min="1" max="' + i.BalanceAmount + '" value="' + i.BalanceAmount + '" required></label>' +
        '<label class="f"><span>Date</span><input name="date" type="date" value="' + today + '"></label>' +
        '<label class="f"><span>Mode</span><select name="mode"><option value="CASH">Cash</option><option value="UPI">UPI</option><option value="BANK_TRANSFER">Bank transfer</option><option value="CHEQUE">Cheque</option></select></label>' +
        '<label class="f" data-ref><span>Reference / UPI ID</span><input name="ref" maxlength="100" autocomplete="off"></label>' +
      '</div><label class="f"><span>Notes</span><input name="notes" maxlength="500" autocomplete="off"></label></form>',
      '<button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="tp-save">Save payment</button>',
      dlg => {
        const mode = $('[name=mode]', dlg), ref = $('[data-ref]', dlg);
        const sync = () => { ref.style.display = mode.value === 'CASH' ? 'none' : ''; };
        mode.addEventListener('change', sync); sync();
        $('#tp-save', dlg).addEventListener('click', ev => busy(ev.target, async () => {
          const amt = Number($('[name=amount]', dlg).value), md = mode.value, rf = $('[name=ref]', dlg).value.trim();
          if (!amt || amt <= 0) { toast('Enter an amount.', true); return; }
          if (amt > i.BalanceAmount) { toast('Amount exceeds the balance.', true); return; }
          if (md !== 'CASH' && !rf) { toast('Please enter the reference.', true); return; }
          await api('teacherIncome.pay', { incomeId: i.IncomeID, amount: amt, mode: md, reference: rf,
            paymentDate: $('[name=date]', dlg).value, notes: $('[name=notes]', dlg).value.trim() });
          closeDlg(); toast('Payment saved.'); await load();
        }));
      });
  };

  $('#ti-month').addEventListener('change', e => { st.month = e.target.value; load().catch(fail); });
  $('#ti-teacher').addEventListener('change', e => { st.teacherId = e.target.value; load().catch(fail); });
  $('#ti-gen').addEventListener('click', () => {
    openDlg('Generate teacher income',
      '<p>Counts each teacher’s active students per subject for the month and multiplies by the pay rate (the student’s special rate if set, otherwise the teacher’s default).</p>' +
      '<label class="f"><span>Month</span><input id="gen-m" type="month" value="' + esc(st.month) + '"></label>' +
      '<p class="muted" style="font-size:.85rem">Records that already have payments are left alone. Unpaid ones are refreshed. Teachers with no pay rate set are skipped.</p>',
      '<button class="btn" type="button" data-close>Cancel</button><button class="btn primary" id="gen-run">Generate</button>',
      dlg => $('#gen-run', dlg).addEventListener('click', ev => busy(ev.target, async () => {
        const m = $('#gen-m', dlg).value;
        if (!/^\d{4}-\d{2}$/.test(m)) { toast('Pick a valid month.', true); return; }
        const r = await api('teacherIncome.generate', { month: m });
        closeDlg();
        toast(r.created + ' created · ' + r.refreshed + ' refreshed' + (r.skippedLocked ? ' · ' + r.skippedLocked + ' locked' : '') + (r.skippedNoRate ? ' · ' + r.skippedNoRate + ' with no pay rate' : ''));
        st.month = m; $('#ti-month').value = m; await load();
      })));
  });

  await load();
};
