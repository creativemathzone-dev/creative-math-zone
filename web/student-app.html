<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102447">
  <meta name="description" content="The Creative Math Zone student portal app for classes, attendance, homework, fees, and receipts.">
  <link rel="manifest" href="./student-app.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script src="./pwa.js" defer></script>
  <title>Creative Math Zone · Student App</title>
  <style>
    :root{color-scheme:dark;--navy:#102447;--deep:#0a1830;--gold:#ffc629;--muted:#d5e0f1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:#fff;font:16px/1.6 'Segoe UI',Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,#244b7a 0%,var(--navy) 48%,var(--deep) 100%)}
    main{width:min(620px,100%);min-height:100vh;margin:auto;padding:28px 20px 48px;display:flex;flex-direction:column;justify-content:center}
    header{display:flex;align-items:center;gap:14px;margin-bottom:36px}
    header img{width:58px;height:58px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #ffc629}
    header b{font-size:1.1rem}header small{display:block;color:var(--muted)}
    section{padding:clamp(24px,6vw,42px);border:1px solid #ffffff2c;border-radius:20px;background:#ffffff0d}
    .eyebrow{margin:0 0 8px;color:var(--gold);font-size:.82rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(2rem,7vw,3rem);line-height:1.1}
    p{color:var(--muted)}
    .open{display:inline-flex;align-items:center;justify-content:center;min-height:50px;margin-top:12px;padding:12px 18px;border-radius:11px;background:var(--gold);color:#142746;text-decoration:none;font-weight:800}
    .open:focus-visible{outline:3px solid white;outline-offset:3px}
    footer{margin-top:24px;color:#bdcbe0;font-size:.9rem;text-align:center}
  </style>
</head>
<body>
  <main>
    <header>
      <img src="./icons/creative-math-zone-logo.png" alt="">
      <div><b>Creative Math Zone</b><small>Student App</small></div>
    </header>
    <section aria-labelledby="title">
      <p class="eyebrow">Student edition</p>
      <h1 id="title">Your learning portal</h1>
      <p>Sign in to view classes, attendance, homework, notices, fee receipts, and class materials.</p>
      <a class="open" href="./student.html?source=student-app">Open Student Portal</a>
    </section>
    <footer>© Creative Math Zone</footer>
  </main>
</body>
</html>
