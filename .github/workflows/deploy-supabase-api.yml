name: Deploy Supabase API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: krjkkkwxqvvxeifxmgjx
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy the API function
        run: supabase functions deploy api --project-ref "$PROJECT_ID"

      - name: Deploy expired class material cleanup
        run: supabase functions deploy cleanup-class-materials --project-ref "$PROJECT_ID"
