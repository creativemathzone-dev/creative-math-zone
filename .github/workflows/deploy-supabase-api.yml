name: Deploy Supabase API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: krjkkkwxqvvxeifxmgjx
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check critical application flows
        run: node --test tests/critical-flows.test.mjs

      - name: Enable Supabase Auth passkeys
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH "https://api.supabase.com/v1/projects/${PROJECT_ID}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data '{"passkey_enabled":true,"webauthn_rp_display_name":"Creative Math Zone","webauthn_rp_id":"creativemathzone.in","webauthn_rp_origins":"https://creativemathzone.in"}'

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Deploy the API function
        run: supabase functions deploy api --project-ref "$PROJECT_ID" --yes

      - name: Deploy expired class material cleanup
        run: supabase functions deploy cleanup-class-materials --project-ref "$PROJECT_ID" --yes

      - name: Deploy Google Drive OAuth
        run: supabase functions deploy google-drive-oauth --project-ref "$PROJECT_ID" --yes

      - name: Deploy homework archive and file access
        run: supabase functions deploy homework-drive --project-ref "$PROJECT_ID" --yes
