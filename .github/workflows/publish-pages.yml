name: Publish Creative Math Zone portal

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Check critical application flows
        run: node --test tests/critical-flows.test.mjs

      # The Android APKs live in the "apps" GitHub Release (not in the code) and
      # are copied here so the download links stay at /downloads/<name>.apk.
      # If this fails, publishing stops and the current site stays online.
      - name: Get the Android apps from the "apps" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          gh release download apps --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir downloads --clobber
          ls -l downloads

      - name: Prepare the website files
        run: |
          mkdir -p _site/web _site/downloads _site/.well-known
          touch _site/.nojekyll
          cp index.html _site/index.html
          cp web/*.html web/*.js _site/web/
          cp web/*.webmanifest _site/web/
          cp -R web/icons _site/web/icons
          cp -R web/vendor _site/web/vendor
          test -f _site/web/vendor/supabase-js-2.105.0.js
          test -f downloads/CreativeMathZone.apk
          test -f downloads/CreativeMathZoneStudent.apk
          test -f downloads/CreativeMathZoneTeacher.apk
          test -f downloads/CreativeMathZoneAdmin.apk
          test -f .well-known/assetlinks.json
          cp downloads/CreativeMathZone.apk _site/downloads/CreativeMathZone.apk
          cp downloads/CreativeMathZoneStudent.apk _site/downloads/CreativeMathZoneStudent.apk
          cp downloads/CreativeMathZoneTeacher.apk _site/downloads/CreativeMathZoneTeacher.apk
          cp downloads/CreativeMathZoneAdmin.apk _site/downloads/CreativeMathZoneAdmin.apk
          # the new CMZ native app (built by "Build CMZ Android app")
          if [ -f downloads/CMZ.apk ]; then cp downloads/CMZ.apk _site/downloads/CMZ.apk; fi
          cp .well-known/assetlinks.json _site/.well-known/assetlinks.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
