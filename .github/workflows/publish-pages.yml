name: Publish Creative Math Zone portal

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Prepare the website files
        run: |
          mkdir -p _site/web
          cp index.html _site/index.html
          cp web/*.html web/*.js _site/web/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
